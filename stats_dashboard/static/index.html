<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Stats Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
:root {
  --bg-primary: #0f0f23;
  --bg-secondary: #1a1a3e;
  --bg-card: linear-gradient(135deg, #1a1a3e 0%, #2d2d5a 100%);
  --text-primary: #ffffff;
  --text-secondary: #888888;
  --accent: #00d4ff;
  --accent2: #00ff88;
  --danger: #ff6b6b;
  --warning: #ffa502;
  --border: rgba(255,255,255,0.1);
  --glow: rgba(0,212,255,0.3);
}

[data-theme="light"] {
  --bg-primary: #f5f7fa;
  --bg-secondary: #ffffff;
  --bg-card: linear-gradient(135deg, #ffffff 0%, #f0f2f5 100%);
  --text-primary: #1a1a2e;
  --text-secondary: #666666;
  --border: rgba(0,0,0,0.1);
  --glow: rgba(0,212,255,0.2);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  transition: background 0.3s, color 0.3s;
}

/* Sidebar */
.sidebar {
  width: 220px;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  position: fixed;
  left: 0; top: 0; bottom: 0;
  padding: 20px 12px;
  display: flex;
  flex-direction: column;
  z-index: 100;
  transition: transform 0.3s, background 0.3s;
}

.sidebar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

.sidebar h1 { font-size: 18px; color: var(--accent); }

.theme-toggle {
  width: 36px; height: 36px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

.menu { list-style: none; flex: 1; }
.menu-item a {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  color: var(--text-secondary);
  text-decoration: none;
  border-radius: 8px;
  margin-bottom: 4px;
  font-size: 14px;
  transition: all 0.2s;
}
.menu-item a:hover { background: rgba(0,212,255,0.1); color: var(--accent); }
.menu-item a.active { background: linear-gradient(90deg, #00d4ff, #0088ff); color: #fff; }
.menu-item .shortcut {
  margin-left: auto;
  font-size: 10px;
  opacity: 0.5;
  background: var(--border);
  padding: 2px 6px;
  border-radius: 4px;
}

.sidebar-footer {
  padding-top: 15px;
  border-top: 1px solid var(--border);
}

.ws-status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-secondary);
}

.ws-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--danger);
}
.ws-dot.connected { background: var(--accent2); }

/* Mobile menu toggle */
.menu-toggle {
  display: none;
  position: fixed;
  top: 15px; left: 15px;
  z-index: 200;
  width: 40px; height: 40px;
  border-radius: 8px;
  border: none;
  background: var(--bg-secondary);
  color: var(--text-primary);
  font-size: 20px;
  cursor: pointer;
}

/* Main */
.main {
  margin-left: 220px;
  flex: 1;
  padding: 20px;
  transition: margin 0.3s;
}

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}
.header h2 { font-size: 22px; }
.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.status {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.status.ok { background: #16a34a; }
.status.err { background: #dc2626; }
.status.warn { background: var(--warning); color: #000; }

.pause-btn {
  padding: 6px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 12px;
  transition: all 0.2s;
}
.pause-btn:hover { background: rgba(0,212,255,0.1); color: var(--accent); }
.pause-btn.paused { background: var(--warning); color: #000; border-color: var(--warning); }

select, input[type="date"] {
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 12px;
  color: var(--text-primary);
  font-size: 13px;
  cursor: pointer;
}

[data-theme="light"] select,
[data-theme="light"] input[type="date"] {
  background: #fff;
}

/* Stats Grid */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}

/* Card */
.card {
  background: var(--bg-card);
  border-radius: 12px;
  padding: 16px;
  border: 1px solid var(--border);
  position: relative;
  overflow: hidden;
  transition: transform 0.2s, box-shadow 0.2s;
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}
.card.glow {
  animation: cardGlow 0.5s ease;
}
@keyframes cardGlow {
  0%, 100% { box-shadow: 0 0 0 rgba(0,212,255,0); }
  50% { box-shadow: 0 0 20px var(--glow); }
}
.card h3 {
  font-size: 10px;
  color: var(--text-secondary);
  text-transform: uppercase;
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}
.card .val {
  font-size: 26px;
  font-weight: 700;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.card .unit { font-size: 12px; color: var(--text-secondary); margin-left: 4px; }
.card.p2p .val { background: linear-gradient(90deg, #00ff88, #88ff00); -webkit-background-clip: text; background-clip: text; }
.card.http .val { background: linear-gradient(90deg, #ff6b6b, #ffa502); -webkit-background-clip: text; background-clip: text; }
.card .trend {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 10px;
}
.card .trend.up { background: rgba(0,255,136,0.2); color: #00ff88; }
.card .trend.down { background: rgba(255,107,107,0.2); color: #ff6b6b; }

/* Sparkline */
.sparkline {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 30px;
  opacity: 0.3;
}

/* Panel */
.panel {
  background: var(--bg-card);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 16px;
  border: 1px solid var(--border);
}
.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}
.panel h3 { font-size: 14px; color: var(--accent); }
.panel-actions {
  display: flex;
  gap: 8px;
}
.export-btn {
  padding: 5px 10px;
  border-radius: 5px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 11px;
}
.export-btn:hover { background: rgba(0,212,255,0.1); color: var(--accent); }

/* Table */
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th {
  padding: 10px 8px;
  text-align: left;
  color: var(--accent);
  font-size: 10px;
  text-transform: uppercase;
  background: rgba(0,212,255,0.1);
  position: sticky;
  top: 0;
}
td {
  padding: 10px 8px;
  border-bottom: 1px solid var(--border);
  color: var(--text-secondary);
}
tr:hover td { background: rgba(0,212,255,0.05); }

/* Pagination */
.page-nav {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-top: 15px;
}
.page-nav button {
  padding: 8px 16px;
  background: rgba(0,212,255,0.1);
  border: 1px solid rgba(0,212,255,0.3);
  border-radius: 6px;
  color: var(--accent);
  cursor: pointer;
  transition: all 0.2s;
}
.page-nav button:hover:not(:disabled) { background: rgba(0,212,255,0.2); }
.page-nav button:disabled { opacity: 0.3; cursor: not-allowed; }
.page-nav span { color: var(--text-secondary); }

/* Section title */
.section {
  font-size: 13px;
  color: var(--accent);
  margin: 25px 0 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* Heatmap */
.heatmap {
  display: grid;
  grid-template-columns: repeat(24, 1fr);
  gap: 3px;
}
.heatmap-cell {
  aspect-ratio: 1;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  color: rgba(255,255,255,0.7);
  cursor: pointer;
  transition: transform 0.2s;
}
.heatmap-cell:hover { transform: scale(1.2); z-index: 1; }
.heatmap-labels {
  display: grid;
  grid-template-columns: repeat(24, 1fr);
  gap: 3px;
  margin-top: 5px;
}
.heatmap-labels span {
  text-align: center;
  font-size: 9px;
  color: var(--text-secondary);
}

/* Alerts */
.alerts-container {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 350px;
}
.alert {
  padding: 12px 16px;
  border-radius: 8px;
  background: var(--bg-secondary);
  border-left: 4px solid var(--warning);
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  animation: slideIn 0.3s ease;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.alert.critical { border-left-color: var(--danger); }
.alert .alert-icon { font-size: 18px; }
.alert .alert-content { flex: 1; }
.alert .alert-title { font-weight: 600; font-size: 13px; margin-bottom: 3px; }
.alert .alert-msg { font-size: 12px; color: var(--text-secondary); }
.alert .alert-close {
  background: none;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 16px;
}
@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* Health Bar */
.health-bar {
  display: flex;
  gap: 15px;
  padding: 10px 15px;
  background: var(--bg-secondary);
  border-radius: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.health-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
}
.health-item .label { color: var(--text-secondary); }
.health-item .value { font-weight: 600; }
.health-item .bar {
  width: 60px;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.health-item .bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.3s;
}
.health-item .bar-fill.ok { background: var(--accent2); }
.health-item .bar-fill.warn { background: var(--warning); }
.health-item .bar-fill.danger { background: var(--danger); }

/* Efficiency Card */
.efficiency-panel {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
}
.efficiency-item {
  text-align: center;
  padding: 20px;
  background: rgba(0,255,136,0.05);
  border-radius: 10px;
  border: 1px solid rgba(0,255,136,0.2);
}
.efficiency-item .big-val {
  font-size: 32px;
  font-weight: 700;
  color: var(--accent2);
}
.efficiency-item .label {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 5px;
}

/* Loading skeleton */
.skeleton {
  background: linear-gradient(90deg, var(--border) 25%, rgba(255,255,255,0.1) 50%, var(--border) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: 4px;
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.skeleton-text { height: 20px; width: 60%; margin-bottom: 8px; }
.skeleton-val { height: 30px; width: 80%; }

/* Settings */
.settings-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
}
.settings-panel {
  background: var(--bg-card);
  border-radius: 12px;
  padding: 20px;
  border: 1px solid var(--border);
}
.settings-panel h3 {
  font-size: 14px;
  color: var(--accent);
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.setting-row:last-child { border-bottom: none; }
.setting-label { font-size: 13px; color: var(--text-secondary); }

.toggle {
  position: relative;
  width: 44px;
  height: 24px;
  background: var(--border);
  border-radius: 12px;
  cursor: pointer;
  transition: background 0.2s;
}
.toggle.on { background: var(--accent); }
.toggle::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 18px;
  height: 18px;
  background: #fff;
  border-radius: 50%;
  transition: transform 0.2s;
}
.toggle.on::after { transform: translateX(20px); }

.save-btn {
  padding: 12px 32px;
  background: linear-gradient(90deg, var(--accent), #0088ff);
  border: none;
  border-radius: 8px;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 20px;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #16a34a;
  color: #fff;
  padding: 12px 24px;
  border-radius: 8px;
  font-size: 14px;
  opacity: 0;
  transition: all 0.3s;
  z-index: 9999;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Charts */
canvas { max-height: 200px; }

/* Responsive */
@media (max-width: 768px) {
  .sidebar {
    transform: translateX(-100%);
  }
  .sidebar.open {
    transform: translateX(0);
  }
  .menu-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .main {
    margin-left: 0;
    padding: 70px 15px 15px;
  }
  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  .header {
    flex-direction: column;
    align-items: flex-start;
  }
}

/* Keyboard hint */
.kbd {
  display: inline-block;
  padding: 2px 6px;
  font-size: 10px;
  background: var(--border);
  border-radius: 4px;
  margin-left: 5px;
}
  </style>
</head>
<body>
  <button class="menu-toggle" onclick="toggleSidebar()">☰</button>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>P2P Stats</h1>
      <button class="theme-toggle" onclick="toggleTheme()" title="테마 전환 (T)">🌙</button>
    </div>
    <ul class="menu">
      <li class="menu-item"><a href="#dashboard" class="active">📊 Dashboard<span class="shortcut">1</span></a></li>
      <li class="menu-item"><a href="#realtime">📡 실시간<span class="shortcut">2</span></a></li>
      <li class="menu-item"><a href="#live">🎬 시청 중<span class="shortcut">3</span></a></li>
      <li class="menu-item"><a href="#analytics">📈 분석<span class="shortcut">4</span></a></li>
      <li class="menu-item"><a href="#history">📜 히스토리<span class="shortcut">5</span></a></li>
      <li class="menu-item"><a href="#settings">⚙️ 설정<span class="shortcut">6</span></a></li>
    </ul>
    <div class="sidebar-footer">
      <div class="ws-status">
        <span class="ws-dot" id="wsDot"></span>
        <span id="wsStatus">연결 중...</span>
      </div>
    </div>
  </aside>

  <div class="alerts-container" id="alerts"></div>
  <main class="main" id="app"></main>

<script>
// State
let page = 'dashboard';
let ws = null;
let paused = false;
let theme = localStorage.getItem('theme') || 'dark';
let lastData = null;
let prevData = null;
let sparklineData = {};
let alerts = [];

// Settings
const defaultSettings = {
  alerts: {
    viewersMin: 0,
    viewersMax: 500000,
    p2pRatioMin: 30,
    enabled: true
  },
  display: {
    animateNumbers: true,
    showSparklines: true
  }
};
let settings = JSON.parse(localStorage.getItem('p2p-settings-v2')) || defaultSettings;

// Initialize theme
document.documentElement.setAttribute('data-theme', theme);
updateThemeIcon();

// Format helpers
function formatNum(n) {
  if (n >= 1e9) return (n/1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n/1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return n?.toLocaleString() || '0';
}

function formatBytes(b) {
  if (!b) return '0 B';
  const u = ['B','KB','MB','GB','TB','PB'];
  const i = Math.floor(Math.log(b) / Math.log(1024));
  return (b / Math.pow(1024, i)).toFixed(i > 2 ? 2 : 1) + ' ' + u[i];
}

function formatTB(b) {
  return (b / 1024 / 1024 / 1024 / 1024).toFixed(2);
}

// Card with optional sparkline
function card(id, title, val, unit = '', cls = '', trend = null) {
  const trendHtml = trend !== null ?
    `<span class="trend ${trend >= 0 ? 'up' : 'down'}">${trend >= 0 ? '↑' : '↓'}${Math.abs(trend).toFixed(1)}%</span>` : '';
  return `<div class="card ${cls}" id="card-${id}" data-value="${val}">
    <h3>${title}</h3>
    <div class="val">${settings.display.animateNumbers ? '0' : formatNum(val)}<span class="unit">${unit}</span></div>
    ${trendHtml}
    ${settings.display.showSparklines ? `<canvas class="sparkline" id="spark-${id}"></canvas>` : ''}
  </div>`;
}

// Animate number
function animateValue(el, start, end, duration = 500) {
  if (!settings.display.animateNumbers) {
    el.innerHTML = formatNum(end) + el.innerHTML.match(/<span.*<\/span>/)?.[0] || '';
    return;
  }
  const range = end - start;
  const startTime = performance.now();
  const unit = el.querySelector('.unit')?.outerHTML || '';

  function update(currentTime) {
    const elapsed = currentTime - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const easeOut = 1 - Math.pow(1 - progress, 3);
    const current = Math.floor(start + range * easeOut);
    el.innerHTML = formatNum(current) + unit;
    if (progress < 1) requestAnimationFrame(update);
  }
  requestAnimationFrame(update);
}

// Update sparkline
function updateSparkline(id, value) {
  if (!settings.display.showSparklines) return;
  if (!sparklineData[id]) sparklineData[id] = [];
  sparklineData[id].push(value);
  if (sparklineData[id].length > 20) sparklineData[id].shift();

  const canvas = document.getElementById(`spark-${id}`);
  if (!canvas) return;

  const ctx = canvas.getContext('2d');
  const data = sparklineData[id];
  const w = canvas.width = canvas.offsetWidth * 2;
  const h = canvas.height = canvas.offsetHeight * 2;
  ctx.clearRect(0, 0, w, h);

  if (data.length < 2) return;

  const max = Math.max(...data);
  const min = Math.min(...data);
  const range = max - min || 1;

  ctx.beginPath();
  ctx.strokeStyle = 'rgba(0, 212, 255, 0.5)';
  ctx.lineWidth = 2;

  data.forEach((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((v - min) / range) * h * 0.8 - h * 0.1;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();
}

// Glow effect on value change
function glowCard(id) {
  const card = document.getElementById(`card-${id}`);
  if (card) {
    card.classList.remove('glow');
    void card.offsetWidth;
    card.classList.add('glow');
  }
}

// WebSocket connection
function connectWS() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${protocol}//${location.host}/ws`);

  ws.onopen = () => {
    document.getElementById('wsDot').classList.add('connected');
    document.getElementById('wsStatus').textContent = '실시간 연결됨';
  };

  ws.onclose = () => {
    document.getElementById('wsDot').classList.remove('connected');
    document.getElementById('wsStatus').textContent = '재연결 중...';
    setTimeout(connectWS, 3000);
  };

  ws.onmessage = (e) => {
    if (paused) return;
    try {
      const data = JSON.parse(e.data);
      prevData = lastData;
      lastData = data;
      if (page === 'dashboard' || page === 'realtime') {
        updateRealtimeUI(data);
      }
      checkAlerts(data);
    } catch (err) {}
  };
}

// Check alerts
function checkAlerts(data) {
  if (!settings.alerts.enabled) return;

  const viewers = data.total?.viewers || 0;
  const p2pRatio = parseFloat(data.total?.p2pRatio) || 0;

  if (viewers < settings.alerts.viewersMin) {
    showAlert('warning', '시청자 감소', `현재 시청자 ${formatNum(viewers)}명 (최소 임계치: ${formatNum(settings.alerts.viewersMin)})`);
  }
  if (viewers > settings.alerts.viewersMax) {
    showAlert('critical', '시청자 급증', `현재 시청자 ${formatNum(viewers)}명 (최대 임계치: ${formatNum(settings.alerts.viewersMax)})`);
  }
  if (p2pRatio < settings.alerts.p2pRatioMin) {
    showAlert('warning', 'P2P 효율 저하', `현재 P2P 비율 ${p2pRatio}% (임계치: ${settings.alerts.p2pRatioMin}%)`);
  }
}

function showAlert(type, title, msg) {
  const id = Date.now();
  const alertsEl = document.getElementById('alerts');
  const alertEl = document.createElement('div');
  alertEl.className = `alert ${type}`;
  alertEl.innerHTML = `
    <span class="alert-icon">${type === 'critical' ? '🚨' : '⚠️'}</span>
    <div class="alert-content">
      <div class="alert-title">${title}</div>
      <div class="alert-msg">${msg}</div>
    </div>
    <button class="alert-close" onclick="this.parentElement.remove()">×</button>
  `;
  alertsEl.appendChild(alertEl);
  setTimeout(() => alertEl.remove(), 10000);
}

// Update realtime UI
function updateRealtimeUI(data) {
  const cards = [
    { id: 'viewers', val: data.total?.viewers },
    { id: 'unique', val: data.total?.uniqueUsers },
    { id: 'p2p', val: parseFloat(data.total?.p2pRatio) },
    { id: 'peers', val: data.total?.peers },
    { id: 'swarms', val: data.activeSwarms }
  ];

  cards.forEach(c => {
    const el = document.querySelector(`#card-${c.id} .val`);
    const cardEl = document.getElementById(`card-${c.id}`);
    if (el && cardEl) {
      const oldVal = parseInt(cardEl.dataset.value) || 0;
      if (oldVal !== c.val) {
        animateValue(el, oldVal, c.val);
        cardEl.dataset.value = c.val;
        glowCard(c.id);
      }
      updateSparkline(c.id, c.val);
    }
  });
}

// Toggle functions
function toggleTheme() {
  theme = theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('theme', theme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const btn = document.querySelector('.theme-toggle');
  if (btn) btn.textContent = theme === 'dark' ? '🌙' : '☀️';
}

function toggleSidebar() {

}

function togglePause() {
  paused = !paused;

  if (btn) {
    btn.classList.toggle('paused', paused);

function toggleSetting(el) {

// Export functions
function exportCSV(data, filename) {
  const rows = [Object.keys(data[0]).join(',')];
  data.forEach(row => rows.push(Object.values(row).join(',')));
  downloadFile(rows.join('\n'), filename + '.csv', 'text/csv');
}

function exportJSON(data, filename) {
  downloadFile(JSON.stringify(data, null, 2), filename + '.json', 'application/json');
}

function downloadFile(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

// Toast
function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2000);
}

function renderDashboard(d) {
  document.getElementById('mainStats').innerHTML = `
    ${card('viewers', '연결 수', d.total?.viewers || 0)}
    ${card('unique', '고유 유저', d.total?.uniqueUsers || 0)}
    ${card('p2p', 'P2P 효율', parseFloat(d.total?.p2pRatio) || 0, '%', 'p2p')}
    ${card('peers', 'P2P 피어', d.total?.peers || 0)}
    ${card('swarms', 'Swarms', d.activeSwarms || 0)}
  `;

  // Animate initial values
  setTimeout(() => {
    ['viewers', 'unique', 'p2p', 'peers', 'swarms'].forEach(id => {
      const cardEl = document.getElementById(`card-${id}`);
      const valEl = cardEl?.querySelector('.val');
      if (valEl && cardEl) {
        animateValue(valEl, 0, parseInt(cardEl.dataset.value) || 0);
      }
    });
  }, 100);

  // Efficiency panel
  const httpBytes = d.total?.httpBytes || 0;
  const p2pBytes = d.total?.p2pBytes || 0;
  const savedBytes = p2pBytes;
  const costPerTB = 0.05; // $0.05 per TB (example CDN cost)
  const savedCost = (savedBytes / 1024 / 1024 / 1024 / 1024) * costPerTB;

  document.getElementById('efficiencyPanel').innerHTML = `
    <div class="efficiency-item">
      <div class="big-val">${formatBytes(savedBytes)}</div>
      <div class="label">P2P로 절감된 트래픽</div>

      <div class="big-val">$${savedCost.toFixed(2)}</div>

    <div class="efficiency-item">
      <div class="big-val">${d.total?.p2pRatio || 0}%</div>
      <div class="label">P2P 분산율</div>
    </div>
  `;

  // Update chart
  const now = new Date().toLocaleTimeString();
  chartHistory.labels.push(now);
  chartHistory.viewers.push(d.total?.viewers || 0);
  chartHistory.unique.push(d.total?.uniqueUsers || 0);
  chartHistory.http.push(parseFloat(formatTB(d.total?.httpBytes || 0)));
  chartHistory.p2p.push(parseFloat(formatTB(d.total?.p2pBytes || 0)));

  if (chartHistory.labels.length > 30) {
    chartHistory.labels.shift();
    chartHistory.viewers.shift();
    chartHistory.unique.shift();
    chartHistory.http.shift();
    chartHistory.p2p.shift();
  }

  if (mainChart) mainChart.update('none');
}

async function loadHealthStats() {
  try {
    const res = await fetch('/api/stats');
    const d = await res.json();

    const cpu = d.cpu_usage || 0;
    const mem = d.memory_percent || 0;

    document.getElementById('cpuVal').textContent = cpu.toFixed(1) + '%';
    document.getElementById('cpuBar').style.width = cpu + '%';
    document.getElementById('cpuBar').className = 'bar-fill ' + (cpu > 80 ? 'danger' : cpu > 50 ? 'warn' : 'ok');

    document.getElementById('memVal').textContent = mem.toFixed(1) + '%';
    document.getElementById('memBar').style.width = mem + '%';
    document.getElementById('memBar').className = 'bar-fill ' + (mem > 80 ? 'danger' : mem > 50 ? 'warn' : 'ok');

    document.getElementById('connVal').textContent = formatNum(d.connections || 0);
    document.getElementById('uptimeVal').textContent = formatUptime(d.uptime_secs || 0);
  } catch (e) {}
}

function formatUptime(secs) {
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  return `${h}h ${m}m`;
}

  document.getElementById('next').onclick = () => { if (liveState.p < Math.ceil(liveState.total / liveState.size)) { liveState.p++; loadLive(); } };

async function loadLive() {
  const res = await fetch(`/api/live?limit=${liveState.size}&offset=${(liveState.p-1)*liveState.size}`);
  const json = await res.json();
  liveState.total = json.total || 0;
  liveState.data = json.data || [];

  document.querySelector('#liveTable tbody').innerHTML = liveState.data.map((d, i) => {
    const idx = (liveState.p - 1) * liveState.size + i + 1;
    const t = (d.http_bytes || 0) + (d.p2p_bytes || 0);
    const ratio = t > 0 ? ((d.p2p_bytes || 0) / t * 100).toFixed(1) : '0';
    return `<tr>
      <td>${idx}</td>
      <td title="${d.filename}">${d.filename?.slice(0,30) || '-'}</td>
      <td style="font-size:10px">${d.swarm_id?.slice(0,12)}...</td>
      <td style="color:#ff6b6b"><b>${d.viewers || 0}</b></td>
      <td>${formatBytes(d.http_bytes)}</td>
      <td>${formatBytes(d.p2p_bytes)}</td>
      <td style="color:#00ff88"><b>${ratio}%</b></td>
    </tr>`;
  }).join('') || '<tr><td colspan="7" style="text-align:center">데이터 없음</td></tr>';

  const pages = Math.ceil(liveState.total / liveState.size) || 1;
  document.getElementById('pageInfo').textContent = `${liveState.p} / ${pages}`;
  document.getElementById('prev').disabled = liveState.p === 1;
  document.getElementById('next').disabled = liveState.p >= pages;
}

async function loadHeatmap() {
  try {
    const res = await fetch('/api/history/hourly?days=7');
    const json = await res.json();
    const data = json.dataset || [];

    const hourData = new Array(24).fill(0);
    data.forEach(row => {
      const hour = row[0];
      const avg = row[1] || 0;
      if (hour >= 0 && hour < 24) hourData[hour] = avg;
    });

    const max = Math.max(...hourData) || 1;

    document.getElementById('heatmap').innerHTML = hourData.map((v, h) => {
      const intensity = v / max;
      const color = `rgba(0, 212, 255, ${0.2 + intensity * 0.8})`;
      return `<div class="heatmap-cell" style="background:${color}" title="${h}시: ${formatNum(v)}명">${h}</div>`;
    }).join('');

    document.getElementById('heatmapLabels').innerHTML =
      Array.from({length: 24}, (_, i) => `<span>${i}</span>`).join('');
  } catch (e) {}
}

async function loadTopContent() {
  try {
    const res = await fetch('/api/history/swarms?period=1d&limit=10');
    const json = await res.json();
    const data = json.dataset || [];

    document.querySelector('#topContent tbody').innerHTML = data.map((row, i) => `

  } catch (e) {}
}

async function loadHistory() {
  const period = document.getElementById('historyPeriod')?.value || '1d';
  const sampleMap = { '1h': '1m', '6h': '5m', '1d': '10m', '7d': '1h', '30d': '6h' };
  const sample = sampleMap[period] || '10m';

  try {
    const res = await fetch(`/api/history/stats?period=${period}&sample=${sample}`);
    const json = await res.json();
    historyData = json.dataset || [];

    const labels = historyData.map(r => {
      const d = new Date(r[0]);
      return period === '1h' || period === '6h' ? d.toLocaleTimeString() : d.toLocaleString();
    });
    const viewers = historyData.map(r => r[1] || 0);
    const uniqueUsers = historyData.map(r => r[2] || 0);
    const httpTB = historyData.map(r => parseFloat(formatTB(r[3] || 0)));
    const p2pTB = historyData.map(r => parseFloat(formatTB(r[4] || 0)));

    if (historyChart) historyChart.destroy();
    if (trafficChart) trafficChart.destroy();

    const textColor = theme === 'dark' ? '#fff' : '#333';
    const gridColor = theme === 'dark' ? '#333' : '#ddd';

    historyChart = new Chart(document.getElementById('historyChart'), {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: '고유 유저', data: uniqueUsers, borderColor: '#00d4ff', tension: 0.3, fill: false },
          { label: '연결 수', data: viewers, borderColor: '#ffa502', tension: 0.3, fill: false }
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: textColor } } },
        scales: {
          x: { ticks: { color: '#888', maxTicksLimit: 10 }, grid: { color: gridColor } },
          y: { ticks: { color: '#888' }, grid: { color: gridColor } }
        }
      }
    });

    trafficChart = new Chart(document.getElementById('trafficChart'), {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: 'HTTP', data: httpTB, borderColor: '#ff6b6b', tension: 0.3, fill: false },
          { label: 'P2P', data: p2pTB, borderColor: '#00ff88', tension: 0.3, fill: false }
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: textColor } } },
        scales: {
          x: { ticks: { color: '#888', maxTicksLimit: 10 }, grid: { color: gridColor } },
          y: { ticks: { color: '#888' }, grid: { color: gridColor } }
        }
      }
    });
  } catch (e) {}
}

function exportHistoryData() {
  if (historyData.length) {
    const data = historyData.map(r => ({
      timestamp: r[0],
      viewers: r[1],
      unique_users: r[2],
      http_bytes: r[3],
      p2p_bytes: r[4]
    }));
    exportCSV(data, 'history-data');
  }
}

function exportChartData() {
  const data = chartHistory.labels.map((l, i) => ({
    time: l,
    viewers: chartHistory.viewers[i],
    unique: chartHistory.unique[i],
    http_tb: chartHistory.http[i],
    p2p_tb: chartHistory.p2p[i]
  }));
  if (data.length) exportCSV(data, 'realtime-chart');
}

// Settings
function saveSettings() {
  settings = {
    alerts: {
      enabled: document.getElementById('alertEnabled').classList.contains('on'),
      viewersMin: parseInt(document.getElementById('viewersMin').value) || 0,
      viewersMax: parseInt(document.getElementById('viewersMax').value) || 500000,
      p2pRatioMin: parseInt(document.getElementById('p2pRatioMin').value) || 30
    },
    display: {
      animateNumbers: document.getElementById('animateNumbers').classList.contains('on'),
      showSparklines: document.getElementById('showSparklines').classList.contains('on')
    }
  };
  localStorage.setItem('p2p-settings-v2', JSON.stringify(settings));
  showToast('설정이 저장되었습니다');
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  switch(e.key) {
    case '1': nav('dashboard'); break;
    case '2': nav('realtime'); break;
    case '3': nav('live'); break;
    case '4': nav('analytics'); break;
    case '5': nav('history'); break;
    case '6': nav('settings'); break;
    case 'r': case 'R': location.reload(); break;
    case 't': case 'T': toggleTheme(); break;
    case 'p': case 'P': togglePause(); break;
    case 'Escape': document.getElementById('sidebar').classList.remove('open'); break;
  }
});

// Init
document.querySelectorAll('.menu-item a').forEach(a => {
  a.onclick = e => { e.preventDefault(); window.location.hash = a.getAttribute('href').slice(1); };
});
window.onhashchange = () => nav(location.hash.slice(1) || 'dashboard');
nav(location.hash.slice(1) || 'dashboard');
connectWS();

// Periodic health check
setInterval(loadHealthStats, 10000);
</script>
</body>
</html>
