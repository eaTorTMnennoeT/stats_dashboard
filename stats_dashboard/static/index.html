function initSummary() {
  // 상태: view (daily/monthly), drillMonth/drillDay (특정 날짜 드릴다운), cardTab (today/week/month)
  let st = { view: 'daily', drillMonth: null, drillDay: null, allData: [], cardTab: 'today' };

  // 서버시간(KST) 기준 연/월/일 가져오기
  function getServerYearMonth() {
    const now = getServerTime();
    const kst = new Date(now.getTime() + serverTimeOffset * 60 * 1000);
    return { year: kst.getUTCFullYear(), month: kst.getUTCMonth() + 1, day: kst.getUTCDate() };
  }

  function renderBreadcrumb() {
    const bc = document.getElementById('breadcrumb');
    const { year } = getServerYearMonth();
    if (st.drillMonth && st.drillDay) {
      bc.innerHTML = `<span class="clickable" onclick="window.summaryBack()" style="cursor:pointer;color:#00d4ff">← ${year}년 ${st.drillMonth}월</span> &gt; <span>${st.drillDay}일 상세</span>`;
    } else if (st.view === 'daily') {
      bc.innerHTML = `<span>${year}년 일별 통계</span>`;
    } else {
      bc.innerHTML = `<span>${year}년</span>`;
    }
  }

  // 기간별 통계 계산 함수
  function calcStats(rows) {
    let plays = 0, visitors = 0, maxUsers = 0, tvmon = 0, tvwiki = 0, tvhot = 0, mobile = 0, pc = 0;
    let firstHttp = null, lastHttp = 0, firstP2p = null, lastP2p = 0, firstP2pUp = null, lastP2pUp = 0;
    rows.forEach(r => {
      plays += r[8] || 0;
      visitors += r[9] || 0;
      tvmon += r[10] || 0;
      tvwiki += r[11] || 0;
      tvhot += r[12] || 0;
      mobile += r[13] || 0;
      pc += r[14] || 0;
      if ((r[1] || 0) > maxUsers) maxUsers = r[1] || 0;
      if (firstHttp === null) firstHttp = r[3] || 0;
      lastHttp = r[3] || 0;
      if (firstP2p === null) firstP2p = r[4] || 0;
      lastP2p = r[4] || 0;
      if (firstP2pUp === null) firstP2pUp = r[5] || 0;
      lastP2pUp = r[5] || 0;
    });
    const http = lastHttp >= firstHttp ? lastHttp - firstHttp : lastHttp;
    const p2p = lastP2p >= firstP2p ? lastP2p - firstP2p : lastP2p;
    const p2pUp = lastP2pUp >= firstP2pUp ? lastP2pUp - firstP2pUp : lastP2pUp;
    const total = http + p2p;
    const ratio = total > 0 ? ((p2p / total) * 100).toFixed(1) : '0';
    return { plays, visitors, maxUsers, tvmon, tvwiki, tvhot, mobile, pc, http, p2p, p2pUp, total, ratio };
  }

  // 고급 카드 렌더링
  function renderCards(rows) {
    const { year, month, day } = getServerYearMonth();

    // 오늘 데이터 필터
    const todayRows = rows.filter(r => {
      const p = getServerDateParts(r[0]);
      return p.month === month && p.day === day;
    });

    // 주간 데이터 (최근 7일)
    const weekRows = rows.filter(r => {
      const p = getServerDateParts(r[0]);
      const rowDate = new Date(year, p.month - 1, p.day);
      const today = new Date(year, month - 1, day);
      const diffDays = Math.floor((today - rowDate) / (1000 * 60 * 60 * 24));
      return diffDays >= 0 && diffDays < 7;
    });

    // 월간 데이터 (이번달)
    const monthRows = rows.filter(r => {
      const p = getServerDateParts(r[0]);
      return p.month === month;
    });

    const stats = {
      today: calcStats(todayRows),
      week: calcStats(weekRows),
      month: calcStats(monthRows)
    };

    const current = stats[st.cardTab];

    // r[10]=tvmon, r[11]=tvwiki, r[12]=tvhot (리퍼러별 재생수)
    // r[13]=mobile, r[14]=pc (디바이스별 재생수)
    // http_bytes, p2p_bytes는 누적값이므로 first/last 차이로 델타 계산
    const byDay = {};

      <td style="text-align:right;color:#a55eea" class="hide-mobile">${Math.round(sumPc/cnt).toLocaleString()}</td>
      <td style="text-align:right;color:#ff6b6b">${formatBytes(Math.round(sumHttp/cnt))}</td>
      <td style="text-align:right;color:#00ff88" class="hide-mobile">${formatBytes(Math.round(sumP2p/cnt))}</td>
      <td style="text-align:right;color:#26de81" class="hide-mobile">${formatBytes(Math.round(sumP2pUp/cnt))}</td>
      <td style="text-align:right;color:#fff">${formatBytes(Math.round(sumTotal/cnt))}</td>
      <td style="text-align:right;color:#ffa502">${sumRatio}%</td>
    </tr>` : '';

    document.querySelector('#summaryTable tbody').innerHTML = (dataRows + sumRow) || '<tr><td colspan="13" style="text-align:center;color:#888">데이터 없음</td></tr>';
  }

  function render() {
    renderBreadcrumb();
    if (st.drillMonth && st.drillDay) {
      renderHourlyTable(st.allData, st.drillMonth, st.drillDay);
    } else if (st.view === 'daily') {
      renderDailyTable(st.allData);
      renderTotals(st.allData);
      renderCards(st.allData);
    } else {
      renderMonthlyTable(st.allData);
      renderTotals(st.allData);
      renderCards(st.allData);
    }
  }

  async function load() {
    try {
      // 일별: 이번달 데이터 (30d, 1h sample)
      // 월별: 1년 데이터 (365d, 1d sample)
      const period = st.view === 'daily' ? '30d' : '365d';
      const sample = st.view === 'daily' ? '1h' : '1d';
      const url = `/api/history/stats?period=${period}&sample=${sample}&_t=${Date.now()}`;
      const data = await fetch(url).then(r => r.json());
      st.allData = data.dataset || [];
      render();
    } catch (e) { console.error('Summary load error:', e); }
  }

  // 글로벌 함수 등록
  window.summaryDrill = (month, day) => {
    st.drillMonth = month;
    st.drillDay = day;
    render();
  };
  window.summaryBack = () => {
    st.drillMonth = null;
    st.drillDay = null;
    render();
  };

  // 버튼 이벤트
  document.querySelectorAll('.summary-period-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.summary-period-btn').forEach(b => {
        b.style.background = 'rgba(255,255,255,.05)';
        b.style.borderColor = 'rgba(255,255,255,.2)';
        b.style.color = '#888';
        b.classList.remove('active');
      });
      btn.style.background = '#00d4ff';
      btn.style.borderColor = '#00d4ff';
      btn.style.color = '#fff';
      btn.classList.add('active');
      st.view = btn.dataset.view;
      st.drillMonth = null;
      st.drillDay = null;
      load();
    };
  });

  load();
  setActiveInterval(load, getPageInterval('summary'));
}

function initAnalysis() {
  let period = 'realtime';
  function formatBytes(bytes) {
    if (!bytes || bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
  }
  function copyToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
  }
  function updateLayout() {
    // 모든 기간에서 동일한 레이아웃 사용
    document.querySelectorAll('.realtime-only').forEach(el => el.style.display = '');
    document.getElementById('analysisCards').style.gridTemplateColumns = 'repeat(5,1fr)';
    const thead = document.getElementById('analysisTableHead');
    if (period === 'realtime') {
      thead.innerHTML = '<tr><th style="text-align:left;width:3%">#</th><th style="text-align:left;width:12%">IP</th><th style="text-align:right;width:5%">세션</th><th style="text-align:center;width:4%">서버</th><th style="text-align:left;width:22%">제목</th><th style="text-align:right;width:10%">HTTP</th><th style="text-align:right;width:10%">P2P Down</th><th style="text-align:right;width:10%">P2P Up</th><th style="text-align:right;width:14%">합계</th></tr>';
    } else {
      thead.innerHTML = '<tr><th style="text-align:left;width:4%">#</th><th style="text-align:left;width:14%">IP</th><th style="text-align:right;width:7%">세션</th><th style="text-align:center;width:6%">서버</th><th style="text-align:right;width:12%">HTTP</th><th style="text-align:right;width:12%">P2P Down</th><th style="text-align:right;width:12%">P2P Up</th><th style="text-align:right;width:16%">합계</th></tr>';
    }
  }
  function render(data) {
    const totals = data.totals || {};
    const ips = data.ips || [];
    updateLayout();
    document.getElementById('analysisUniqueIps').textContent = (totals.uniqueIps || 0).toLocaleString();
    document.getElementById('analysisTotalSessions').textContent = (totals.totalSessions || 0).toLocaleString();
    document.getElementById('analysisTotalHttp').textContent = formatBytes(totals.totalHttp || 0);
    document.getElementById('analysisTotalP2p').textContent = formatBytes(totals.totalP2p || 0);
    document.getElementById('analysisTotalP2pUp').textContent = formatBytes(totals.totalP2pUp || 0);
    document.getElementById('analysisCount').textContent = `상위 ${ips.length}개`;
    const tbody = document.querySelector('#analysisTable tbody');
    if (ips.length === 0) { tbody.innerHTML = `<tr><td colspan="${period === 'realtime' ? 9 : 8}" style="text-align:center;color:#888">데이터 없음</td></tr>`; return; }
    const totalTraffic = (totals.totalHttp || 0) + (totals.totalP2p || 0);
    tbody.innerHTML = ips.map((ip, i) => {
      const serverNum = ip.server ? (ip.server.match(/every(\d+)/) || [])[1] || '-' : '-';
      const pct = totalTraffic > 0 ? ((ip.totalBytes / totalTraffic) * 100).toFixed(2) : 0;
      const filename = ip.filename || '-';
      const shortFilename = filename.length > 30 ? filename.slice(0, 30) + '...' : filename;
      if (period === 'realtime') {
        return `<tr><td style="color:#666">${i + 1}</td><td class="copy-ip" data-ip="${ip.ip}" style="font-family:monospace;font-size:11px;cursor:pointer" title="클릭하여 복사">${ip.ip}</td><td style="text-align:right;color:#fd9644">${ip.sessions}</td><td style="text-align:center;color:#00d4ff" title="${ip.server||''}">${serverNum}</td><td style="color:#aaa;font-size:11px" title="${filename}">${shortFilename}</td><td style="text-align:right;color:#ff6b6b">${formatBytes(ip.httpBytes)}</td><td style="text-align:right;color:#00ff88">${formatBytes(ip.p2pBytes)}</td><td style="text-align:right;color:#26de81">${formatBytes(ip.p2pUpBytes)}</td><td style="text-align:right;color:#fff;font-weight:bold">${formatBytes(ip.totalBytes)} <span style="color:#666;font-size:10px">(${pct}%)</span></td></tr>`;
      } else {
        return `<tr><td style="color:#666">${i + 1}</td><td class="copy-ip" data-ip="${ip.ip}" style="font-family:monospace;font-size:11px;cursor:pointer" title="클릭하여 복사">${ip.ip}</td><td style="text-align:right;color:#fd9644">${ip.sessions}</td><td style="text-align:center;color:#00d4ff" title="${ip.server||''}">${serverNum}</td><td style="text-align:right;color:#ff6b6b">${formatBytes(ip.httpBytes)}</td><td style="text-align:right;color:#00ff88">${formatBytes(ip.p2pBytes)}</td><td style="text-align:right;color:#26de81">${formatBytes(ip.p2pUpBytes)}</td><td style="text-align:right;color:#fff;font-weight:bold">${formatBytes(ip.totalBytes)} <span style="color:#666;font-size:10px">(${pct}%)</span></td></tr>`;
      }
    }).join('');
    // IP 복사 이벤트
    tbody.querySelectorAll('.copy-ip').forEach(td => {
      td.onclick = () => {
        copyToClipboard(td.dataset.ip);
        td.style.color = '#00ff88';
        setTimeout(() => td.style.color = '', 300);
      };
    });
  }
  async function load() {
    const data = await fetch(`/api/ip-analysis?period=${period}&limit=100&_t=${Date.now()}`).then(r => r.json());
    render(data);
  }
  // 버튼 이벤트
  document.querySelectorAll('.analysis-period-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.analysis-period-btn').forEach(b => { b.style.background = 'rgba(255,255,255,.05)'; b.style.borderColor = 'rgba(255,255,255,.2)'; b.style.color = '#888'; });
      btn.style.background = '#00d4ff'; btn.style.borderColor = '#00d4ff'; btn.style.color = '#fff';
      period = btn.dataset.period;
      load();
    };
  });
  load();
  setActiveInterval(load, 5000); // 5초마다 갱신
}

function initVisitors() {
  let st = { p: 1, size: 50, period: '1d', ip: '' };
  function render(data) {
    const rows = data.dataset || [];
    document.querySelector('#visitorsTable tbody').innerHTML = rows.map((r, i) => {
      const idx = (st.p - 1) * st.size + i + 1;
      const ts = r[0] ? formatServerDateTime(r[0]) : '-';
      const ip = r[1] || '-';
      const fn = r[4]?.length > 30 ? r[4].slice(0, 30) + '...' : (r[4] || '-');
      const dev = r[6] || r[5] || '-';
      const br = r[7]?.length > 15 ? r[7].slice(0, 15) + '...' : (r[7] || '-');
      const ref = r[8]?.length > 20 ? r[8].slice(0, 20) + '...' : (r[8] || 'direct');
      return `<tr><td>${idx}</td><td style="font-size:11px">${ts}</td><td style="font-size:11px">${ip}</td><td title="${r[4]}">${fn}</td><td>${dev}</td><td>${br}</td><td title="${r[8]}">${ref}</td></tr>`;
    }).join('') || '<tr><td colspan="7" style="text-align:center">데이터 없음</td></tr>';
    document.getElementById('pageInfo').textContent = `${st.p} 페이지`;
    document.getElementById('prev').disabled = st.p === 1;
    document.getElementById('next').disabled = rows.length < st.size;
  }
  function getEndpoint() {
    let url = `/api/visitors?period=${st.period}&limit=${st.size}&offset=${(st.p-1)*st.size}`;
    if (st.ip) url += `&ip=${encodeURIComponent(st.ip)}`;
    return url;
  }
  async function load() {
    try { await loadWithCache(getEndpoint(), 'visitors', render); } catch (e) { console.error(e); }
  }
  document.getElementById('prev').onclick = () => { if (st.p > 1) { st.p--; load(); } };
  document.getElementById('next').onclick = () => { st.p++; load(); };
  document.getElementById('visitorPeriod').onchange = (e) => { st.period = e.target.value; st.p = 1; load(); };
  document.getElementById('searchBtn').onclick = () => { st.ip = document.getElementById('ipSearch').value.trim(); st.p = 1; load(); };
  document.getElementById('ipSearch').onkeypress = (e) => { if (e.key === 'Enter') { st.ip = e.target.value.trim(); st.p = 1; load(); } };
  load();

  // 실시간 갱신 (설정 변경 시 자동 업데이트)
  setActiveInterval(load, getPageInterval('visitors'));
}

let historyChart = null;
let historyTrafficChart = null;

function initHistory() {
  loadHistory();
}

async function loadHistory() {
  const period = document.getElementById('historyPeriod')?.value || '1d';
  const sampleMap = { '1h': '1m', '6h': '5m', '1d': '10m', '7d': '1h', '30d': '6h' };
  const sample = sampleMap[period] || '10m';

  try {
    const data = await fetchWithCache(`/api/history/stats?period=${period}&sample=${sample}`, 'history');

    if (data.error) {
      console.error('History error:', data.error);
      return;
    }

    const rows = data.dataset || [];
    // 서버시간(KST) 기준 레이블
    const labels = rows.map(r => {
      return (period === '1h' || period === '6h') ? formatServerTime(r[0]) : formatServerDateTime(r[0]);
    });
    const viewers = rows.map(r => r[1] || 0);
    const uniqueUsers = rows.map(r => r[2] || 0);
    const httpTB = rows.map(r => (r[3] || 0) / 1024 / 1024 / 1024 / 1024);
    const p2pTB = rows.map(r => (r[4] || 0) / 1024 / 1024 / 1024 / 1024);

    // Destroy old charts
    if (historyChart) historyChart.destroy();
    if (historyTrafficChart) historyTrafficChart.destroy();

    // Viewers chart
    historyChart = new Chart(document.getElementById('historyChart'), {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: '고유 유저', data: uniqueUsers, borderColor: '#00d4ff', tension: 0.3, fill: false },
          { label: '연결 수', data: viewers, borderColor: '#ffa502', tension: 0.3, fill: false }
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#fff' } } },
        scales: {
          x: { ticks: { color: '#888', maxTicksLimit: 12 }, grid: { color: '#333' } },
          y: { ticks: { color: '#888' }, grid: { color: '#333' } }
        }
      }
    });

    // Traffic chart
    historyTrafficChart = new Chart(document.getElementById('historyTrafficChart'), {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: 'HTTP', data: httpTB, borderColor: '#ff6b6b', tension: 0.3, fill: false },
          { label: 'P2P Down', data: p2pTB, borderColor: '#00ff88', tension: 0.3, fill: false }
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#fff' } } },
        scales: {
          x: { ticks: { color: '#888', maxTicksLimit: 12 }, grid: { color: '#333' } },
          y: { ticks: { color: '#888' }, grid: { color: '#333' } }
        }
      }
    });
  } catch (e) {
    console.error('History fetch error:', e);
  }
}

nav(location.hash.slice(1) || 'dashboard');
