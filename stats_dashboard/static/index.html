        options: { ...chartOpts, cutout: '60%', plugins: { legend: { display: false } } }
      });
      playerPie = new Chart(document.getElementById('playerPie'), {
        type: 'doughnut', data: { labels: ['Player 1', 'Player 2'], datasets: [{ data: [p1, p2], backgroundColor: ['#ff6b6b', '#a55eea'], borderWidth: 0 }] },
        options: { ...chartOpts, cutout: '60%', plugins: { legend: { display: false } } }
      });
      browserPie = new Chart(document.getElementById('browserPie'), {
        type: 'doughnut', data: { labels: br.map(x => x.name), datasets: [{ data: br.map(x => x.count), backgroundColor: ['#ffa502', '#ff6b6b', '#00d4ff', '#00ff88', '#a55eea'], borderWidth: 0 }] },
        options: { ...chartOpts, cutout: '60%', plugins: { legend: { display: false } } }
      });
      referrerPie = new Chart(document.getElementById('referrerPie'), {
        type: 'doughnut', data: { labels: ref.map(x => x.name || 'direct'), datasets: [{ data: ref.map(x => x.count), backgroundColor: ['#a55eea', '#26de81', '#fd9644', '#00d4ff', '#ff6b6b'], borderWidth: 0 }] },
        options: { ...chartOpts, cutout: '60%', plugins: { legend: { display: false } } }
      });
      deviceNameBar = new Chart(document.getElementById('deviceNameBar'), {
        type: 'bar', data: { labels: dn.map(x => x.name?.slice(0,15) || '-'), datasets: [{ data: dn.map(x => x.count), backgroundColor: '#26de81', borderRadius: 4 }] },
        options: barOpts
      });
    } else {
      trafficPie.data.datasets[0].data = [httpBytes, p2pBytes, p2pUpBytes]; trafficPie.update('none');
      devicePie.data.datasets[0].data = [dev.mobile||0, dev.desktop||0, dev.tablet||0, dev.unknown||0]; devicePie.update('none');
      playerPie.data.datasets[0].data = [p1, p2]; playerPie.update('none');
      browserPie.data.labels = br.map(x => x.name); browserPie.data.datasets[0].data = br.map(x => x.count); browserPie.update('none');
      referrerPie.data.labels = ref.map(x => x.name || 'direct'); referrerPie.data.datasets[0].data = ref.map(x => x.count); referrerPie.update('none');
      deviceNameBar.data.labels = dn.map(x => x.name?.slice(0,15) || '-'); deviceNameBar.data.datasets[0].data = dn.map(x => x.count); deviceNameBar.update('none');
    }
  }
  async function update() {
    try { await loadWithCache('/api/realtime', 'charts', render); } catch (e) { console.error(e); }
  }
  update();
  setActiveInterval(update, getPageInterval('charts'));
  window.addEventListener('hashchange', () => { trafficPie = devicePie = playerPie = browserPie = referrerPie = deviceNameBar = null; }, { once: true });
}

function initSummary() {
  // 상태: view (daily/monthly), drillMonth/drillDay (특정 날짜 드릴다운), cardTab (today/week/month)
  let st = { view: 'daily', drillMonth: null, drillDay: null, allData: [], dailyData: [], monthlyData: [], cardTab: 'today', summaryData: null };

  // 서버시간(KST) 기준 연/월/일 가져오기
  function getServerYearMonth() {
    const now = getServerTime();
    const kst = new Date(now.getTime() + serverTimeOffset * 60 * 1000);
    return { year: kst.getUTCFullYear(), month: kst.getUTCMonth() + 1, day: kst.getUTCDate() };
  }

  function renderBreadcrumb() {
    const bc = document.getElementById('breadcrumb');
    const { year } = getServerYearMonth();
    if (st.drillMonth && st.drillDay) {
      bc.innerHTML = `<span class="clickable" onclick="window.summaryBack()" style="cursor:pointer;color:#00d4ff">← ${year}년 ${st.drillMonth}월</span> &gt; <span>${st.drillDay}일 상세</span>`;
    } else if (st.view === 'daily') {
      bc.innerHTML = `<span>${year}년 일별 통계</span>`;
    } else {
      bc.innerHTML = `<span>${year}년</span>`;
    }
  }

  // 기간별 통계 계산 함수
  function calcStats(rows) {
    let plays = 0, visitors = 0, maxUsers = 0, tvmon = 0, tvwiki = 0, tvhot = 0, mobile = 0, pc = 0;
    let firstHttp = null, lastHttp = 0, firstP2p = null, lastP2p = 0, firstP2pUp = null, lastP2pUp = 0;
    rows.forEach(r => {
      plays += r[8] || 0;
      visitors += r[9] || 0;
      tvmon += r[10] || 0;
      tvwiki += r[11] || 0;
      tvhot += r[12] || 0;
      mobile += r[13] || 0;
      pc += r[14] || 0;
      if ((r[1] || 0) > maxUsers) maxUsers = r[1] || 0;
      if (firstHttp === null) firstHttp = r[3] || 0;
      lastHttp = r[3] || 0;
      if (firstP2p === null) firstP2p = r[4] || 0;
      lastP2p = r[4] || 0;
      if (firstP2pUp === null) firstP2pUp = r[5] || 0;
      lastP2pUp = r[5] || 0;
    });
    const http = lastHttp >= firstHttp ? lastHttp - firstHttp : lastHttp;
    const p2p = lastP2p >= firstP2p ? lastP2p - firstP2p : lastP2p;
    const p2pUp = lastP2pUp >= firstP2pUp ? lastP2pUp - firstP2pUp : lastP2pUp;
    const total = http + p2p;
    const ratio = total > 0 ? ((p2p / total) * 100).toFixed(1) : '0';
    return { plays, visitors, maxUsers, tvmon, tvwiki, tvhot, mobile, pc, http, p2p, p2pUp, total, ratio };
  }

  // 고급 카드 렌더링
  function renderCards(rows) {
    const { year, month, day } = getServerYearMonth();

    // 오늘 데이터 필터
    const todayRows = rows.filter(r => {
      const p = getServerDateParts(r[0]);
      return p.month === month && p.day === day;
    });

    // 주간 데이터 (최근 7일)
    const weekRows = rows.filter(r => {
      const p = getServerDateParts(r[0]);
      const rowDate = new Date(year, p.month - 1, p.day);
      const today = new Date(year, month - 1, day);
      const diffDays = Math.floor((today - rowDate) / (1000 * 60 * 60 * 24));
      return diffDays >= 0 && diffDays < 7;
    });

    // 월간 데이터 (이번달)
    const monthRows = rows.filter(r => {
      const p = getServerDateParts(r[0]);
      return p.month === month;
    });

    const stats = {
      today: calcStats(todayRows),
      week: calcStats(weekRows),
      month: calcStats(monthRows)
    };

    // /api/summary의 정확한 데이터 사용 (시간별 합산 대신 count_distinct)
    if (st.summaryData && st.summaryData.today) {
      const t = st.summaryData.today;
      stats.today.visitors = t.unique_visitors || stats.today.visitors;
      stats.today.plays = t.plays || stats.today.plays;
      stats.today.http = t.http_bytes || stats.today.http;
      stats.today.p2p = t.p2p_bytes || stats.today.p2p;
      stats.today.total = (t.http_bytes || 0) + (t.p2p_bytes || 0) || stats.today.total;
      stats.today.ratio = stats.today.total > 0 ? ((stats.today.p2p / stats.today.total) * 100).toFixed(1) : stats.today.ratio;
      stats.today.maxUsers = t.max_users || stats.today.maxUsers;
    }
    // dailyData[0]에서 오늘 유입경로/디바이스 데이터
    if (st.dailyData && st.dailyData[0]) {

      stats.today.tvmon = d[3] || stats.today.tvmon;
      stats.today.tvwiki = d[4] || stats.today.tvwiki;
      stats.today.tvhot = d[5] || stats.today.tvhot;
      stats.today.mobile = d[6] || stats.today.mobile;
      stats.today.pc = d[7] || stats.today.pc;
      stats.today.p2pUp = d[10] || stats.today.p2pUp;

          <div style="font-size:11px;color:#a55eea;text-transform:uppercase;margin-bottom:8px;font-weight:600">P2P 비율</div>
          <div style="font-size:28px;font-weight:700;color:#a55eea">${current.ratio}%</div>
        </div>
      </div>

      <!-- 트래픽 상세 -->
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px">
        <div style="background:rgba(255,107,107,.1);border-radius:10px;padding:14px;display:flex;justify-content:space-between;align-items:center">

  // dailyData 형식: [date, plays, unique_visitors, tvmon, tvwiki, tvhot, mobile, pc, http_bytes, p2p_bytes, p2p_up_bytes, max_viewers, max_users]
  function renderDailyTable(dailyData) {

    document.getElementById('tableTitle').textContent = '일별 통계 (서버시간 KST)';

    document.getElementById('summaryTableHead').innerHTML = `

        <th style="text-align:right">P2P%</th>
      </tr>
    `;

    // dailyData를 직접 사용 (이미 일별로 집계된 정확한 데이터)

        month: p.month, day: p.day, dayOfWeek: p.dayOfWeek,

        tvmon: r[3] || 0,
        tvwiki: r[4] || 0,

        pc: r[7] || 0,
        http: r[8] || 0,
        p2p: r[9] || 0,
        p2pUp: r[10] || 0,

    const dataRows = rows.map(r => {

      return `<tr>

  let dailyTrendChart = null;
  let lastChartDataHash = '';
  function renderDailyTrendChart() {
    const canvas = document.getElementById('dailyTrendChart');
    if (!canvas || !st.dailyData || st.dailyData.length === 0) return;
    if (typeof Chart === 'undefined') return;

    // 최근 14일 데이터 (역순으로 정렬되어 있으므로 slice 후 reverse)
    const data = st.dailyData.slice(0, 14).reverse();

    // 데이터 변경 확인 (변경 없으면 차트 재생성 안함 - 흔들림 방지)
    const dataHash = JSON.stringify(data.map(r => [r[1], r[2], r[11]]));
    if (dataHash === lastChartDataHash && dailyTrendChart) return;
    lastChartDataHash = dataHash;

    const labels = data.map(r => {
      const p = getServerDateParts(r[0]);
      return `${p.month}/${p.day}(${p.dayOfWeek})`;
    });
    const plays = data.map(r => r[1] || 0);
    const visitors = data.map(r => r[2] || 0);
    const maxViewers = data.map(r => r[11] || 0);

    if (dailyTrendChart) dailyTrendChart.destroy();

    dailyTrendChart = new Chart(canvas, {
      type: 'line',
      data: {
        labels,
        datasets: [
          {
            label: '재생수',

    if (st.drillMonth && st.drillDay) {
      renderHourlyTable(st.allData, st.drillMonth, st.drillDay);
    } else if (st.view === 'daily') {
      renderDailyTable(st.dailyData);  // dailyData 사용 (정확한 고유 방문자)
      renderTotals(st.allData);
      renderCards(st.allData);
      renderDailyTrendChart();
    } else {
      renderMonthlyTable(st.monthlyData, st.allData);  // monthlyData 사용 (정확한 고유 방문자)
      renderTotals(st.allData);
      renderCards(st.allData);
      renderDailyTrendChart();

      // init-data API로 데이터 로드

      st.summaryData = initData.summary || {};
      st.dailyData = initData.daily_stats?.dataset || [];
      st.monthlyData = initData.monthly_stats?.dataset || [];

      // 초기 렌더링 (캐시 데이터로 빠르게)
      render();

      // 드릴다운용 시간별 데이터는 백그라운드에서 로드
      const t = Date.now();
      if (st.view === 'daily') {
        fetch(`/api/history/stats?period=30d&sample=1h&_t=${t}`).then(r => r.json()).then(histData => {
          st.allData = histData.dataset || [];
        });
      } else {
        fetch(`/api/history/stats?period=365d&sample=1d&_t=${t}`).then(r => r.json()).then(histData => {
          st.allData = histData.dataset || [];
        });
      }
    } catch (e) { console.error('Summary load error:', e); }
  }

  // 글로벌 함수 등록
  window.summaryDrill = (month, day) => {
    st.drillMonth = month;
    st.drillDay = day;
    render();
  };
  window.summaryBack = () => {
    st.drillMonth = null;
    st.drillDay = null;
    render();
  };

  // 버튼 이벤트
  document.querySelectorAll('.summary-period-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.summary-period-btn').forEach(b => {

        b.style.borderColor = 'rgba(255,255,255,.2)';

        b.classList.remove('active');
      });
      btn.style.background = '#00d4ff';
      btn.style.borderColor = '#00d4ff';
      btn.style.color = '#fff';
      btn.classList.add('active');
      st.view = btn.dataset.view;
      st.drillMonth = null;
      st.drillDay = null;
      load();
    };
  });

  load();
  setActiveInterval(load, getPageInterval('summary'));
}

function initAnalysis() {
  let period = 'realtime';
  function formatBytes(bytes) {
    if (!bytes || bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
  }
  function copyToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
  }
  function updateLayout() {
    // 모든 기간에서 동일한 레이아웃 사용
    document.querySelectorAll('.realtime-only').forEach(el => el.style.display = '');
    document.getElementById('analysisCards').style.gridTemplateColumns = 'repeat(5,1fr)';
    const thead = document.getElementById('analysisTableHead');
    if (period === 'realtime') {
      thead.innerHTML = '<tr><th style="text-align:left;width:3%">#</th><th style="text-align:left;width:12%">IP</th><th style="text-align:right;width:5%">세션</th><th style="text-align:center;width:4%">서버</th><th style="text-align:left;width:22%">제목</th><th style="text-align:right;width:10%">HTTP</th><th style="text-align:right;width:10%">P2P Down</th><th style="text-align:right;width:10%">P2P Up</th><th style="text-align:right;width:14%">합계</th></tr>';
    } else {
      thead.innerHTML = '<tr><th style="text-align:left;width:4%">#</th><th style="text-align:left;width:14%">IP</th><th style="text-align:right;width:7%">세션</th><th style="text-align:center;width:6%">서버</th><th style="text-align:right;width:12%">HTTP</th><th style="text-align:right;width:12%">P2P Down</th><th style="text-align:right;width:12%">P2P Up</th><th style="text-align:right;width:16%">합계</th></tr>';
    }
  }
  function render(data) {
    const totals = data.totals || {};
    const ips = data.ips || [];
    updateLayout();
    document.getElementById('analysisUniqueIps').textContent = (totals.uniqueIps || 0).toLocaleString();
    document.getElementById('analysisTotalSessions').textContent = (totals.totalSessions || 0).toLocaleString();
    document.getElementById('analysisTotalHttp').textContent = formatBytes(totals.totalHttp || 0);
    document.getElementById('analysisTotalP2p').textContent = formatBytes(totals.totalP2p || 0);
    document.getElementById('analysisTotalP2pUp').textContent = formatBytes(totals.totalP2pUp || 0);
    document.getElementById('analysisCount').textContent = `상위 ${ips.length}개`;
    const tbody = document.querySelector('#analysisTable tbody');
    if (ips.length === 0) { tbody.innerHTML = `<tr><td colspan="${period === 'realtime' ? 9 : 8}" style="text-align:center;color:#888">데이터 없음</td></tr>`; return; }
    const totalTraffic = (totals.totalHttp || 0) + (totals.totalP2p || 0);
    tbody.innerHTML = ips.map((ip, i) => {
      const serverNum = ip.server ? (ip.server.match(/every(\d+)/) || [])[1] || '-' : '-';
      const pct = totalTraffic > 0 ? ((ip.totalBytes / totalTraffic) * 100).toFixed(2) : 0;
      const filename = ip.filename || '-';
      const shortFilename = filename.length > 30 ? filename.slice(0, 30) + '...' : filename;
      if (period === 'realtime') {
        return `<tr><td style="color:#666">${i + 1}</td><td class="copy-ip" data-ip="${ip.ip}" style="font-family:monospace;font-size:11px;cursor:pointer" title="클릭하여 복사">${ip.ip}</td><td style="text-align:right;color:#fd9644">${ip.sessions}</td><td style="text-align:center;color:#00d4ff" title="${ip.server||''}">${serverNum}</td><td style="color:#aaa;font-size:11px" title="${filename}">${shortFilename}</td><td style="text-align:right;color:#ff6b6b">${formatBytes(ip.httpBytes)}</td><td style="text-align:right;color:#00ff88">${formatBytes(ip.p2pBytes)}</td><td style="text-align:right;color:#26de81">${formatBytes(ip.p2pUpBytes)}</td><td style="text-align:right;color:#fff;font-weight:bold">${formatBytes(ip.totalBytes)} <span style="color:#666;font-size:10px">(${pct}%)</span></td></tr>`;
      } else {
        return `<tr><td style="color:#666">${i + 1}</td><td class="copy-ip" data-ip="${ip.ip}" style="font-family:monospace;font-size:11px;cursor:pointer" title="클릭하여 복사">${ip.ip}</td><td style="text-align:right;color:#fd9644">${ip.sessions}</td><td style="text-align:center;color:#00d4ff" title="${ip.server||''}">${serverNum}</td><td style="text-align:right;color:#ff6b6b">${formatBytes(ip.httpBytes)}</td><td style="text-align:right;color:#00ff88">${formatBytes(ip.p2pBytes)}</td><td style="text-align:right;color:#26de81">${formatBytes(ip.p2pUpBytes)}</td><td style="text-align:right;color:#fff;font-weight:bold">${formatBytes(ip.totalBytes)} <span style="color:#666;font-size:10px">(${pct}%)</span></td></tr>`;
      }
    }).join('');
    // IP 복사 이벤트
    tbody.querySelectorAll('.copy-ip').forEach(td => {
      td.onclick = () => {
        copyToClipboard(td.dataset.ip);
        td.style.color = '#00ff88';
        setTimeout(() => td.style.color = '', 300);
      };
    });
  }
  async function load() {
    const data = await fetch(`/api/ip-analysis?period=${period}&limit=100&_t=${Date.now()}`).then(r => r.json());
    render(data);
  }
  // 버튼 이벤트
  document.querySelectorAll('.analysis-period-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.analysis-period-btn').forEach(b => { b.style.background = 'rgba(255,255,255,.05)'; b.style.borderColor = 'rgba(255,255,255,.2)'; b.style.color = '#888'; });
      btn.style.background = '#00d4ff'; btn.style.borderColor = '#00d4ff'; btn.style.color = '#fff';
      period = btn.dataset.period;
      load();
    };
  });
  load();
  setActiveInterval(load, getPageInterval('analysis'));
}

function initVisitors() {
  let st = { p: 1, size: 50, period: '1d', ip: '' };
  function render(data) {
    const rows = data.dataset || [];
    document.querySelector('#visitorsTable tbody').innerHTML = rows.map((r, i) => {
      const idx = (st.p - 1) * st.size + i + 1;
      const ts = r[0] ? formatServerDateTime(r[0]) : '-';
      const ip = r[1] || '-';
      const fn = r[4]?.length > 30 ? r[4].slice(0, 30) + '...' : (r[4] || '-');
      const dev = r[6] || r[5] || '-';
      const br = r[7]?.length > 15 ? r[7].slice(0, 15) + '...' : (r[7] || '-');
      const ref = r[8]?.length > 20 ? r[8].slice(0, 20) + '...' : (r[8] || 'direct');
      return `<tr><td>${idx}</td><td style="font-size:11px">${ts}</td><td style="font-size:11px">${ip}</td><td title="${r[4]}">${fn}</td><td>${dev}</td><td>${br}</td><td title="${r[8]}">${ref}</td></tr>`;
    }).join('') || '<tr><td colspan="7" style="text-align:center">데이터 없음</td></tr>';
    document.getElementById('pageInfo').textContent = `${st.p} 페이지`;
    document.getElementById('prev').disabled = st.p === 1;
    document.getElementById('next').disabled = rows.length < st.size;
  }
  function getEndpoint() {
    let url = `/api/visitors?period=${st.period}&limit=${st.size}&offset=${(st.p-1)*st.size}`;
    if (st.ip) url += `&ip=${encodeURIComponent(st.ip)}`;
    return url;
  }
  async function load() {
    try { await loadWithCache(getEndpoint(), 'visitors', render); } catch (e) { console.error(e); }
  }
  document.getElementById('prev').onclick = () => { if (st.p > 1) { st.p--; load(); } };
  document.getElementById('next').onclick = () => { st.p++; load(); };
  document.getElementById('visitorPeriod').onchange = (e) => { st.period = e.target.value; st.p = 1; load(); };
  document.getElementById('searchBtn').onclick = () => { st.ip = document.getElementById('ipSearch').value.trim(); st.p = 1; load(); };
  document.getElementById('ipSearch').onkeypress = (e) => { if (e.key === 'Enter') { st.ip = e.target.value.trim(); st.p = 1; load(); } };
  load();

  // 실시간 갱신 (설정 변경 시 자동 업데이트)
  setActiveInterval(load, getPageInterval('visitors'));
}

async function loadHistory() {
  const period = document.getElementById('historyPeriod')?.value || '1d';
  const sampleMap = { '1h': '1m', '6h': '5m', '1d': '10m', '7d': '1h', '30d': '6h' };
  const sample = sampleMap[period] || '10m';

  try {
    const data = await fetchWithCache(`/api/history/stats?period=${period}&sample=${sample}`, 'history');

    if (data.error) {
      console.error('History error:', data.error);
      return;
    }

    const rows = data.dataset || [];
    // 서버시간(KST) 기준 레이블
    const labels = rows.map(r => {
      return (period === '1h' || period === '6h') ? formatServerTime(r[0]) : formatServerDateTime(r[0]);
    });
    const viewers = rows.map(r => r[1] || 0);
    const uniqueUsers = rows.map(r => r[2] || 0);
    const httpTB = rows.map(r => (r[3] || 0) / 1024 / 1024 / 1024 / 1024);
    const p2pTB = rows.map(r => (r[4] || 0) / 1024 / 1024 / 1024 / 1024);

    // Destroy old charts
    if (historyChart) historyChart.destroy();
    if (historyTrafficChart) historyTrafficChart.destroy();

    // Viewers chart
    historyChart = new Chart(document.getElementById('historyChart'), {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: '고유 유저', data: uniqueUsers, borderColor: '#00d4ff', tension: 0.3, fill: false },
          { label: '연결 수', data: viewers, borderColor: '#ffa502', tension: 0.3, fill: false }
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#fff' } } },
        scales: {
          x: { ticks: { color: '#888', maxTicksLimit: 12 }, grid: { color: '#333' } },
          y: { ticks: { color: '#888' }, grid: { color: '#333' } }
        }
      }
    });

    // Traffic chart
    historyTrafficChart = new Chart(document.getElementById('historyTrafficChart'), {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: 'HTTP', data: httpTB, borderColor: '#ff6b6b', tension: 0.3, fill: false },
          { label: 'P2P Down', data: p2pTB, borderColor: '#00ff88', tension: 0.3, fill: false }
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#fff' } } },
        scales: {
          x: { ticks: { color: '#888', maxTicksLimit: 12 }, grid: { color: '#333' } },
          y: { ticks: { color: '#888' }, grid: { color: '#333' } }
        }
      }
    });
  } catch (e) {
    console.error('History fetch error:', e);
  }
}

const TRACKER_API = 'https://tracker.netguard742.com:2053';

// 시그널링 로그 캐시 (1분마다 갱신)
let cachedLogs = { logs: [] };
let logsInterval = null;

async function loadSignalingLogs() {
  try {
    const t = Date.now();
    cachedLogs = await fetch(`${TRACKER_API}/api/logs?limit=50&_t=${t}`).then(r => r.json()).catch(() => ({ logs: [] }));
    updateSignalingLogsUI();
  } catch (e) {
    console.error('Failed to load signaling logs:', e);
  }
}

function updateSignalingLogsUI() {
  const logsDiv = document.getElementById('messageLogs');
  if (!logsDiv) return;

  const logs = cachedLogs.logs || [];
  if (logs.length === 0) {
    logsDiv.innerHTML = '<div style="color:#666">로그 수집 중...</div>';
    return;
  }

  const formatGeo = (isp, city, country) => {
    if (city) return city.slice(0, 12);
    if (isp) return isp.split(' ')[0].slice(0, 10);
    if (country) return country;
    return '?';
  };

  const formatTier = (tier) => {
    const tiers = {
      'isp_city': { label: 'ISP+도시', color: '#00ff88' },
      'isp': { label: 'ISP', color: '#26de81' },
      'city': { label: '도시', color: '#45aaf2' },
      'country': { label: '국가', color: '#fed330' },
      'random': { label: '해외', color: '#fc5c65' }
    };
    return tiers[tier] || { label: '?', color: '#666' };
  };

  logsDiv.innerHTML = logs.map(log => {
    const time = new Date(log.timestamp).toLocaleTimeString('ko-KR');
    const typeColor = log.type === 'offer' ? '#a55eea' : '#00ff88';
    const typeIcon = log.type === 'offer' ? '→' : '←';
    const shortFrom = log.from_peer.slice(-8);
    const shortTo = log.to_peer.slice(-8);
    const fromGeo = formatGeo(log.from_isp, log.fromCity, log.fromCountry);
    const toGeo = formatGeo(log.to_isp, log.toCity, log.toCountry);
    const tier = formatTier(log.matchTier);
    return `<div style="padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap;overflow:visible">
<span style="color:#666">[${time}]</span> <span style="color:${typeColor};font-weight:bold">${log.type.toUpperCase().padEnd(6)}</span> <span style="color:#888">${shortFrom}</span> <span style="color:#666">(${fromGeo})</span> <span style="color:${typeColor}">${typeIcon}</span> <span style="color:#888">${shortTo}</span> <span style="color:#666">(${toGeo})</span> <span style="background:${tier.color};color:#000;padding:1px 6px;border-radius:3px;font-size:10px;margin-left:8px">${tier.label}</span></div>`;
  }).join('');
}

let trackerChartData = { labels: [], connections: [], offers: [], answers: [] };
let trackerRealtimeChart = null;
let ispPieChart = null;
let countryPieChart = null;
let cityBarChart = null;

async function loadTrackerStats() {
  try {
    const t = Date.now();
    const [stats, swarms, isps, countries, cities, connections] = await Promise.all([
      fetch(`${TRACKER_API}/api/stats?_t=${t}`).then(r => r.json()),
      fetch(`${TRACKER_API}/api/swarms?limit=5&_t=${t}`).then(r => r.json()),
      fetch(`${TRACKER_API}/api/isps?_t=${t}`).then(r => r.json()),
      fetch(`${TRACKER_API}/api/countries?_t=${t}`).then(r => r.json()).catch(() => ({ countries: [] })),
      fetch(`${TRACKER_API}/api/cities?limit=10&_t=${t}`).then(r => r.json()).catch(() => ({ cities: [] })),
      fetch(`${TRACKER_API}/api/connections?limit=20&_t=${t}`).then(r => r.json()).catch(() => ({ connections: [] }))
    ]);

    // 상태 표시
    const statusEl = document.getElementById('trackerStatus');
    if (statusEl) {
      statusEl.className = 'status ok';
      statusEl.textContent = 'Connected';
    }

    // 메인 통계 카드
    document.getElementById('trackerStats').innerHTML = `
      ${card('활성 연결', stats.activeConnections || 0, '개')}
      ${card('활성 스웜', stats.activeSwarms || 0, '개')}
      ${card('총 피어', stats.totalPeers || 0, '명')}
      ${card('총 Announce', stats.totalAnnounces || 0, '회')}
    `;

    // 성공률, 만료율 계산
    const offers = stats.offersRelayed || 0;
    const answers = stats.answersRelayed || 0;
    const expired = stats.answersExpired || 0;
    const totalPeers = stats.totalPeers || 0;
    const activeSwarms = stats.activeSwarms || 0;

    const successRate = offers > 0 ? Math.round(answers / offers * 100) : 0;
    const expireRate = offers > 0 ? Math.round(expired / offers * 100) : 0;

    document.getElementById('successRate').textContent = successRate + '%';
    document.getElementById('successRate').style.color = successRate >= 80 ? '#00ff88' : successRate >= 50 ? '#ffa502' : '#ff6b6b';
    document.getElementById('expireRate').textContent = expireRate + '%';
    document.getElementById('expireRate').style.color = expireRate <= 5 ? '#00ff88' : expireRate <= 15 ? '#ffa502' : '#ff6b6b';
    document.getElementById('totalPeers').textContent = totalPeers.toLocaleString();
    document.getElementById('activeSwarms2').textContent = activeSwarms.toLocaleString();

    // 시그널링 통계
    document.getElementById('offersRelayed').textContent = offers.toLocaleString();
    document.getElementById('answersRelayed').textContent = answers.toLocaleString();
    document.getElementById('answersExpired').textContent = expired.toLocaleString();
    document.getElementById('totalConns').textContent = (stats.totalConnections || 0).toLocaleString();
    document.getElementById('totalAnnounces').textContent = (stats.totalAnnounces || 0).toLocaleString();

    // 지역 기반 매칭 통계
    const sameIspCity = stats.matchesSameIspCity || 0;
    const sameIsp = stats.matchesSameIsp || 0;
    const sameCity = stats.matchesSameCity || 0;
    const sameCountry = stats.matchesSameCountry || 0;
    const randomMatch = stats.matchesRandom || 0;
    const totalMatches = sameIspCity + sameIsp + sameCity + sameCountry + randomMatch;

    document.getElementById('matchesSameIspCity').textContent = sameIspCity.toLocaleString();
    document.getElementById('matchesSameIsp').textContent = sameIsp.toLocaleString();
    document.getElementById('matchesSameCity').textContent = sameCity.toLocaleString();
    document.getElementById('matchesSameCountry').textContent = sameCountry.toLocaleString();
    document.getElementById('matchesRandom').textContent = randomMatch.toLocaleString();

    if (totalMatches > 0) {
      const pctIspCity = Math.round(sameIspCity / totalMatches * 100);
      const pctIsp = Math.round(sameIsp / totalMatches * 100);
      const pctCity = Math.round(sameCity / totalMatches * 100);
      const pctCountry = Math.round(sameCountry / totalMatches * 100);
      const pctRandom = Math.round(randomMatch / totalMatches * 100);

      document.getElementById('matchesSameIspCityPct').textContent = pctIspCity + '%';
      document.getElementById('matchesSameIspPct').textContent = pctIsp + '%';
      document.getElementById('matchesSameCityPct').textContent = pctCity + '%';
      document.getElementById('matchesSameCountryPct').textContent = pctCountry + '%';
      document.getElementById('matchesRandomPct').textContent = pctRandom + '%';

      document.getElementById('barSameIspCity').style.width = pctIspCity + '%';
      document.getElementById('barSameIsp').style.width = pctIsp + '%';
      document.getElementById('barSameCity').style.width = pctCity + '%';
      document.getElementById('barSameCountry').style.width = pctCountry + '%';
      document.getElementById('barRandom').style.width = pctRandom + '%';
    }

    // 업타임
    const uptime = stats.uptime || 0;
    const days = Math.floor(uptime / 86400);
    const hours = Math.floor((uptime % 86400) / 3600);
    const mins = Math.floor((uptime % 3600) / 60);
    const secs = uptime % 60;
    let uptimeStr = '';
    if (days > 0) uptimeStr += `${days}일 `;
    if (hours > 0) uptimeStr += `${hours}시간 `;
    if (mins > 0) uptimeStr += `${mins}분 `;
    uptimeStr += `${secs}초`;
    const uptimeEl = document.getElementById('trackerUptime2');
    if (uptimeEl) uptimeEl.textContent = uptimeStr;

    // 실시간 차트 데이터 추가
    const now = new Date().toLocaleTimeString('ko-KR', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    trackerChartData.labels.push(now);
    trackerChartData.connections.push(stats.activeConnections || 0);
    trackerChartData.offers.push(offers);
    trackerChartData.answers.push(answers);
    if (trackerChartData.labels.length > 20) {
      trackerChartData.labels.shift();
      trackerChartData.connections.shift();
      trackerChartData.offers.shift();
      trackerChartData.answers.shift();
    }
    updateTrackerRealtimeChart();

    // ISP 파이 차트 + 레전드
    updateIspPieChart(isps.isps || []);

    // 국가별 파이 차트 + 레전드
    updateCountryPieChart(countries.countries || []);

    // 도시별 막대 차트
    updateCityBarChart(cities.cities || []);

    // 인기 스웜 테이블 (클릭 가능하게)
    const tbody = document.querySelector('#trackerSwarms tbody');
    if (tbody && swarms.swarms) {
      tbody.innerHTML = swarms.swarms.map((s, i) => {
        const age = Math.floor((Date.now() - s.createdAt) / 1000);
        let ageStr = '';
        if (age < 60) ageStr = `${age}초`;
        else if (age < 3600) ageStr = `${Math.floor(age/60)}분`;
        else if (age < 86400) ageStr = `${Math.floor(age/3600)}시간`;
        else ageStr = `${Math.floor(age/86400)}일`;
        const shortId = s.infoHash.length > 40 ? s.infoHash.slice(0, 40) + '...' : s.infoHash;
        return `<tr style="cursor:pointer" onclick="showSwarmDetail('${s.infoHash}')">
          <td style="text-align:center;color:#a55eea;font-weight:bold">${i + 1}</td>
          <td style="text-align:left;font-size:9px;word-break:break-all">${shortId}</td>
          <td style="text-align:right;color:#00d4ff;font-weight:bold">${s.peerCount}</td>
          <td style="text-align:right;color:#888">${s.announces.toLocaleString()}</td>
          <td style="text-align:right;color:#666">${ageStr}</td>
        </tr>`;
      }).join('');
    }

    // ISP 테이블
    const ispTbody = document.querySelector('#trackerIsps tbody');
    if (ispTbody && isps.isps) {
      const sortedIsps = isps.isps.sort((a, b) => b.peer_count - a.peer_count).slice(0, 15);
      ispTbody.innerHTML = sortedIsps.map((isp, i) => {
        const total = isp.offers_internal + isp.offers_external;
        const ratio = total > 0 ? Math.round(isp.offers_internal / total * 100) : 0;
        const ratioColor = ratio >= 30 ? '#00ff88' : ratio >= 10 ? '#ffa502' : '#ff6b6b';
        return `<tr>
          <td style="text-align:center;color:#00ff88;font-weight:bold">${i + 1}</td>
          <td style="text-align:left;font-size:11px">${isp.name} <span style="color:#666">(AS${isp.asn})</span></td>
          <td style="text-align:right;color:#00d4ff;font-weight:bold">${isp.peer_count.toLocaleString()}</td>
          <td style="text-align:right;color:#00ff88">${isp.offers_internal.toLocaleString()}</td>
          <td style="text-align:right;color:#ffa502">${isp.offers_external.toLocaleString()}</td>
          <td style="text-align:right;color:${ratioColor};font-weight:bold">${ratio}%</td>
        </tr>`;
      }).join('');
    }

    // 실시간 메시지 로그는 1분마다 별도 갱신 (updateSignalingLogsUI)

    // 피어 연결 관계
    const connTbody = document.querySelector('#trackerConnections tbody');
    if (connTbody && connections.connections) {
      if (connections.connections.length === 0) {
        connTbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#666">연결 데이터 수집 중...</td></tr>';
      } else {
        connTbody.innerHTML = connections.connections.map(c => {
          const shortFrom = c.from_peer.slice(-8);
          const shortTo = c.to_peer.slice(-8);
          const fromIsp = c.from_isp ? c.from_isp.split(' ')[0].slice(0, 12) : '?';
          const toIsp = c.to_isp ? c.to_isp.split(' ')[0].slice(0, 12) : '?';
          return `<tr style="cursor:pointer" onclick="showPeerDetail('${c.from_peer}')">
            <td style="font-size:10px;color:#a55eea">${shortFrom}</td>
            <td style="font-size:10px;color:#888">${fromIsp}</td>
            <td style="font-size:10px;color:#00ff88">${shortTo}</td>
            <td style="font-size:10px;color:#888">${toIsp}</td>
            <td style="text-align:right;font-size:11px"><span style="color:#a55eea">${c.offer_count}</span>/<span style="color:#00ff88">${c.answer_count}</span></td>
          </tr>`;
        }).join('');
      }
    }

  } catch (e) {
    console.error('Tracker stats error:', e);
    const statusEl = document.getElementById('trackerStatus');
    if (statusEl) {
      statusEl.className = 'status err';
      statusEl.textContent = 'Offline';
    }
  }
}

// 피어 상세 팝업
async function showPeerDetail(peerId) {
  try {
    const res = await fetch(`${TRACKER_API}/api/peer/${encodeURIComponent(peerId)}?_t=${Date.now()}`);
    if (!res.ok) {
      alert('피어를 찾을 수 없습니다.');
      return;
    }
    const peer = await res.json();
    const modal = document.getElementById('settingsModal');
    const content = document.querySelector('.modal-content');

    const connList = Object.entries(peer.offers_sent_to || {}).map(([p, cnt]) =>
      `<div style="padding:4px 8px;background:rgba(165,94,234,.1);border-radius:4px;font-size:10px">
        → ${p.slice(-8)} <span style="color:#a55eea">(${cnt} offers)</span>
      </div>`
    ).join('') || '<div style="color:#666">없음</div>';

    content.innerHTML = `
      <h2 style="margin-bottom:20px">피어 상세</h2>
      <div style="font-size:11px;word-break:break-all;color:#888;margin-bottom:15px">${peer.peer_id}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:20px">
        <div style="padding:15px;background:rgba(0,212,255,.1);border-radius:8px">
          <div style="font-size:11px;color:#888">IP</div>
          <div style="font-size:14px;color:#00d4ff">${peer.ip || 'N/A'}</div>
        </div>
        <div style="padding:15px;background:rgba(0,255,136,.1);border-radius:8px">
          <div style="font-size:11px;color:#888">ISP</div>
          <div style="font-size:14px;color:#00ff88">${peer.isp || 'N/A'}</div>
        </div>
        <div style="padding:15px;background:rgba(255,165,2,.1);border-radius:8px">
          <div style="font-size:11px;color:#888">국가</div>
          <div style="font-size:14px;color:#ffa502">${peer.country || 'N/A'}</div>
        </div>
        <div style="padding:15px;background:rgba(165,94,234,.1);border-radius:8px">
          <div style="font-size:11px;color:#888">스웜 수</div>
          <div style="font-size:14px;color:#a55eea">${peer.swarms?.length || 0}개</div>
        </div>
      </div>
      <div style="margin-bottom:15px">
        <div style="font-size:12px;color:#888;margin-bottom:8px">Offer 전송: <span style="color:#a55eea">${peer.offers_sent}</span> / Answer 전송: <span style="color:#00ff88">${peer.answers_sent}</span></div>
      </div>
      <div style="margin-bottom:15px">
        <div style="font-size:12px;color:#888;margin-bottom:8px">연결된 피어 (${peer.connected_peers?.length || 0})</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;max-height:100px;overflow-y:auto">${connList}</div>
      </div>
      <button onclick="closeModal()" style="width:100%;padding:12px;background:#a55eea;border:none;border-radius:8px;color:#fff;cursor:pointer">닫기</button>
    `;
    modal.classList.add('show');
  } catch (e) {
    console.error('Peer detail error:', e);
  }
}

function updateTrackerRealtimeChart() {
  const ctx = document.getElementById('trackerRealtimeChart');
  if (!ctx) return;
  if (!trackerRealtimeChart) {
    trackerRealtimeChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: trackerChartData.labels,
        datasets: [
          { label: '연결', data: trackerChartData.connections, borderColor: '#00d4ff', backgroundColor: 'rgba(0,212,255,.1)', fill: true, tension: 0.3 },
          { label: 'Offer', data: trackerChartData.offers, borderColor: '#a55eea', backgroundColor: 'transparent', tension: 0.3 },
          { label: 'Answer', data: trackerChartData.answers, borderColor: '#00ff88', backgroundColor: 'transparent', tension: 0.3 }
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#fff', boxWidth: 12 } } },
        scales: {
          x: { ticks: { color: '#666', maxTicksLimit: 8 }, grid: { color: '#333' } },
          y: { ticks: { color: '#888' }, grid: { color: '#333' } }
        }
      }
    });
  } else {
    trackerRealtimeChart.data.labels = trackerChartData.labels;
    trackerRealtimeChart.data.datasets[0].data = trackerChartData.connections;
    trackerRealtimeChart.data.datasets[1].data = trackerChartData.offers;
    trackerRealtimeChart.data.datasets[2].data = trackerChartData.answers;
    trackerRealtimeChart.update('none');
  }
}

function updateIspPieChart(isps) {
  const ctx = document.getElementById('ispPieChart');
  const legendDiv = document.getElementById('ispLegend');
  if (!ctx) return;

  // ISP 약어 매핑
  const ispShortNames = {
    'Korea Telecom': 'KT',
    'SK Broadband Co Ltd': 'SK브로드밴드',
    'LG POWERCOMM': 'LG U+',
    'LG DACOM Corporation': 'LG DACOM',
    'LG HelloVision Corp.': 'LG헬로비전',
    'SK Telecom': 'SKT',
    'DLIVE': 'D\'LIVE',
    'DACOM-PUBNETPLUS': 'DACOM'
  };

  const topIsps = isps.sort((a, b) => b.peer_count - a.peer_count).slice(0, 6);
  const labels = topIsps.map(i => ispShortNames[i.name] || i.name.slice(0, 12));
  const data = topIsps.map(i => i.peer_count);
  const colors = ['#00d4ff', '#00ff88', '#a55eea', '#ffa502', '#ff6b6b', '#45aaf2'];

  if (!ispPieChart) {
    ispPieChart = new Chart(ctx, {
      type: 'doughnut',
      data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0 }] },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: { legend: { display: false } }
      }
    });
  } else {
    ispPieChart.data.labels = labels;
    ispPieChart.data.datasets[0].data = data;
    ispPieChart.update('none');
  }

  // ISP 레전드
  if (legendDiv) {
    const total = data.reduce((a, b) => a + b, 0);
    legendDiv.innerHTML = topIsps.map((isp, i) => {
      const pct = total > 0 ? Math.round(isp.peer_count / total * 100) : 0;
      return `<div style="display:flex;align-items:center;gap:6px;padding:4px 8px;background:rgba(255,255,255,.05);border-radius:6px;font-size:11px">
        <span style="width:10px;height:10px;background:${colors[i]};border-radius:2px"></span>
        <span style="color:#ccc">${labels[i]}</span>
        <span style="color:${colors[i]};font-weight:bold">${isp.peer_count.toLocaleString()}</span>
        <span style="color:#666">(${pct}%)</span>
      </div>`;
    }).join('');
  }
}

function updateCountryPieChart(countries) {
  const ctx = document.getElementById('countryPieChart');
  const legendDiv = document.getElementById('countryStats');
  if (!ctx) return;

  const countryFlags = {
    'KR': '🇰🇷', 'US': '🇺🇸', 'JP': '🇯🇵', 'CN': '🇨🇳', 'DE': '🇩🇪',
    'FR': '🇫🇷', 'GB': '🇬🇧', 'CA': '🇨🇦', 'AU': '🇦🇺', 'BR': '🇧🇷',
    'IN': '🇮🇳', 'RU': '🇷🇺', 'TW': '🇹🇼', 'HK': '🇭🇰', 'SG': '🇸🇬',
    'NL': '🇳🇱', 'SE': '🇸🇪', 'PL': '🇵🇱', 'IT': '🇮🇹', 'ES': '🇪🇸',
    'TH': '🇹🇭', 'VN': '🇻🇳', 'ID': '🇮🇩', 'MY': '🇲🇾', 'PH': '🇵🇭'
  };
  const countryNames = {
    'KR': '한국', 'US': '미국', 'JP': '일본', 'CN': '중국', 'DE': '독일',
    'FR': '프랑스', 'GB': '영국', 'CA': '캐나다', 'AU': '호주', 'BR': '브라질',
    'IN': '인도', 'RU': '러시아', 'TW': '대만', 'HK': '홍콩', 'SG': '싱가포르',
    'NL': '네덜란드', 'SE': '스웨덴', 'PL': '폴란드', 'IT': '이탈리아', 'ES': '스페인',
    'TH': '태국', 'VN': '베트남', 'ID': '인도네시아', 'MY': '말레이시아', 'PH': '필리핀'
  };

  const topCountries = countries.slice(0, 6);
  const labels = topCountries.map(c => countryNames[c.code] || c.code);
  const data = topCountries.map(c => c.peer_count);
  const colors = ['#ffa502', '#ff6b6b', '#a55eea', '#00d4ff', '#00ff88', '#45aaf2'];

  if (countries.length === 0) {
    if (legendDiv) legendDiv.innerHTML = '<div style="color:#666;font-size:12px">국가 데이터 수집 중...</div>';
    return;
  }

  if (!countryPieChart) {
    countryPieChart = new Chart(ctx, {
      type: 'doughnut',
      data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0 }] },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: { legend: { display: false } }
      }
    });
  } else {
    countryPieChart.data.labels = labels;
    countryPieChart.data.datasets[0].data = data;
    countryPieChart.update('none');
  }

  // 국가 레전드
  if (legendDiv) {
    const total = data.reduce((a, b) => a + b, 0);
    legendDiv.innerHTML = topCountries.map((c, i) => {
      const flag = countryFlags[c.code] || '🌐';
      const name = countryNames[c.code] || c.code;
      const pct = total > 0 ? Math.round(c.peer_count / total * 100) : 0;
      return `<div style="display:flex;align-items:center;gap:6px;padding:4px 8px;background:rgba(255,255,255,.05);border-radius:6px;font-size:11px">
        <span style="font-size:14px">${flag}</span>
        <span style="color:#ccc">${name}</span>
        <span style="color:${colors[i]};font-weight:bold">${c.peer_count.toLocaleString()}</span>
        <span style="color:#666">(${pct}%)</span>
      </div>`;
    }).join('');
  }
}

function updateCityBarChart(cities) {
  const ctx = document.getElementById('cityBarChart');
  if (!ctx) return;

  if (cities.length === 0) return;

  const labels = cities.map(c => c.name || 'Unknown');
  const data = cities.map(c => c.peer_count);
  const colors = [
    '#ff6b6b', '#ffa502', '#00d4ff', '#00ff88', '#a55eea',
    '#45aaf2', '#fd79a8', '#fdcb6e', '#6c5ce7', '#00cec9'
  ];

  if (!cityBarChart) {
    cityBarChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: '피어 수',
          data,
          backgroundColor: colors,
          borderWidth: 0,
          borderRadius: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {

            ticks: { color: '#888' },
            beginAtZero: true
          }
        }
      }
    });
  } else {
    cityBarChart.data.labels = labels;
    cityBarChart.data.datasets[0].data = data;
    cityBarChart.update('none');
  }
}
