<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Stats Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f23;
      color: #fff;
      min-height: 100vh;
      display: flex;
    }
    .sidebar {
      width: 220px;
      background: linear-gradient(180deg, #1a1a3e 0%, #0d0d1f 100%);
      border-right: 1px solid rgba(255,255,255,0.1);
      position: fixed;
      left: 0; top: 0; bottom: 0;
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
    }
    .sidebar h1 { font-size: 18px; margin-bottom: 25px; color: #00d4ff; }
    .menu { list-style: none; flex: 1; }
    .menu-item a {
      display: block;
      padding: 12px 14px;
      color: #888;
      text-decoration: none;
      border-radius: 8px;
      margin-bottom: 4px;
      font-size: 14px;
    }
    .menu-item a:hover { background: rgba(0,212,255,0.1); color: #00d4ff; }
    .menu-item a.active { background: linear-gradient(90deg, #00d4ff, #0088ff); color: #fff; }
    .settings-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      color: #888;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .settings-btn:hover { background: rgba(0,212,255,0.1); color: #00d4ff; border-color: rgba(0,212,255,0.3); }
    .main { margin-left: 220px; flex: 1; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header h2 { font-size: 22px; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .header-right select {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      padding: 6px 12px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    .cache-indicator { font-size: 11px; color: #888; padding: 4px 8px; background: rgba(255,255,255,0.05); border-radius: 4px; }
    .cache-indicator.active { color: #00ff88; background: rgba(0,255,136,0.1); }
    .status { padding: 6px 14px; border-radius: 20px; font-size: 12px; }
    .status.ok { background: #16a34a; }
    .status.err { background: #dc2626; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .card {
      background: linear-gradient(135deg, #1a1a3e 0%, #2d2d5a 100%);
      border-radius: 10px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .card h3 { font-size: 10px; color: #888; text-transform: uppercase; margin-bottom: 6px; }
    .card .val { font-size: 24px; font-weight: 700; background: linear-gradient(90deg, #00d4ff, #00ff88); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .card .unit { font-size: 12px; color: #666; }
    .card.p2p .val { background: linear-gradient(90deg, #00ff88, #88ff00); -webkit-background-clip: text; }
    .card.http .val { background: linear-gradient(90deg, #ff6b6b, #ffa502); -webkit-background-clip: text; }
    .panel { background: linear-gradient(135deg, #1a1a3e 0%, #2d2d5a 100%); border-radius: 10px; padding: 16px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.1); }
    .panel h3 { font-size: 14px; color: #00d4ff; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
    th { padding: 8px; text-align: left; color: #00d4ff; font-size: 10px; text-transform: uppercase; background: rgba(0,212,255,0.1); }
    th:nth-child(1) { width: 40px; }
    th:nth-child(2) { width: 35%; }
    th:nth-child(3) { width: 20%; }
    th:nth-child(4) { width: 60px; }
    th:nth-child(5) { width: 80px; }
    th:nth-child(6) { width: 80px; }
    th:nth-child(7) { width: 60px; }
    td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #ccc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .page-nav { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
    .page-nav button { padding: 6px 12px; background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.3); border-radius: 6px; color: #00d4ff; cursor: pointer; }
    .page-nav button:disabled { opacity: 0.3; cursor: not-allowed; }
    .page-nav span { color: #888; line-height: 30px; }
    canvas { max-height: 180px; }
    .section { font-size: 14px; color: #00d4ff; margin: 20px 0 10px; }

    /* Responsive Table - 13 columns */
    .responsive-table { width: 100%; table-layout: fixed; font-size: 11px; }
    .responsive-table th, .responsive-table td { padding: 4px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .responsive-table th:nth-child(1) { width: 4%; }    /* 날짜/시간/월 */
    .responsive-table th:nth-child(2) { width: 8%; }    /* 재생수 */
    .responsive-table th:nth-child(3) { width: 8%; }    /* 방문자 */
    .responsive-table th:nth-child(4) { width: 8%; }    /* tvmon */
    .responsive-table th:nth-child(5) { width: 8%; }    /* tvwiki */
    .responsive-table th:nth-child(6) { width: 8%; }    /* tvhot */
    .responsive-table th:nth-child(7) { width: 8%; }    /* Mobile */
    .responsive-table th:nth-child(8) { width: 7%; }    /* PC */
    .responsive-table th:nth-child(9) { width: 7%; }    /* HTTP */
    .responsive-table th:nth-child(10) { width: 7%; }   /* P2P↓ */
    .responsive-table th:nth-child(11) { width: 6%; }   /* P2P↑ */
    .responsive-table th:nth-child(12) { width: 8%; }   /* 합계 */
    .responsive-table th:nth-child(13) { width: 5%; }   /* P2P% */
    .responsive-table .clickable { cursor: pointer; color: #00d4ff; }
    .responsive-table .clickable:hover { text-decoration: underline; }
    @media (max-width: 768px) {
      .responsive-table { font-size: 11px; }
      .responsive-table th, .responsive-table td { padding: 4px 3px; }
      .responsive-table .hide-mobile { display: none; }
      .responsive-table th:nth-child(1) { width: 10%; }
      .responsive-table th:nth-child(2) { width: 14%; }
      .responsive-table th:nth-child(3) { width: 14%; }
      .responsive-table th:nth-child(4) { width: 10%; }
      .responsive-table th:nth-child(5) { width: 10%; }
      .responsive-table th:nth-child(6) { width: 10%; }
      .responsive-table th:nth-child(9) { width: 12%; }
      .responsive-table th:nth-child(12) { width: 12%; }
      .responsive-table th:nth-child(13) { width: 8%; }
    }

    /* Server Table - 9 columns with % widths */
    #serverTable { width: 100%; table-layout: fixed; font-size: 12.5px; }
    #serverTable th, #serverTable td { padding: 10px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
    #serverTable th:nth-child(1), #serverTable td:nth-child(1) { text-align: left; width: 3%; }   /* 서버 */
    #serverTable th:nth-child(2) { width: 12%; }  /* HTTP */
    #serverTable th:nth-child(3) { width: 12%; }  /* P2P↓ */
    #serverTable th:nth-child(4) { width: 12%; }  /* P2P↑ */
    #serverTable th:nth-child(5) { width: 13%; }  /* HTTP GB/s */
    #serverTable th:nth-child(6) { width: 13%; }  /* P2P↓ GB/s */
    #serverTable th:nth-child(7) { width: 13%; }  /* P2P↑ GB/s */
    #serverTable th:nth-child(8) { width: 10%; }  /* P2P% */
    #serverTable th:nth-child(9) { width: 12%; }  /* 접속자 */
    @media (max-width: 768px) {
      #serverTable { font-size: 12px; }
      #serverTable th, #serverTable td { padding: 6px 4px; }
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle.on { background: #00d4ff; }
    .toggle::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle.on::after { transform: translateX(20px); }

    /* Settings Page */
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .settings-panel {
      background: linear-gradient(135deg, #1a1a3e 0%, #2d2d5a 100%);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .settings-panel h3 {
      font-size: 14px;
      color: #00d4ff;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .setting-row:last-child { border-bottom: none; }
    .setting-label { font-size: 13px; color: #ccc; }
    .setting-row select {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      padding: 8px 12px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    .setting-row select:focus { outline: none; border-color: #00d4ff; }
    .save-btn {
      display: inline-block;
      padding: 12px 32px;
      background: linear-gradient(90deg, #00d4ff, #0088ff);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .save-btn:hover { opacity: 0.9; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #16a34a;
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 9999;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Settings Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9998;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: linear-gradient(135deg, #1a1a3e 0%, #2d2d5a 100%);
      border-radius: 12px;
      padding: 24px;
      min-width: 320px;
      max-width: 400px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .modal-header h3 { color: #00d4ff; font-size: 16px; }
    .modal-close {
      background: none;
      border: none;
      color: #888;
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
    }
    .modal-close:hover { color: #fff; }
    .mode-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .mode-tab {
      flex: 1;
      padding: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: #888;
      cursor: pointer;
      text-align: center;
      font-size: 13px;
      transition: all 0.2s;
    }
    .mode-tab.active {
      background: rgba(0,212,255,0.2);
      border-color: #00d4ff;
      color: #00d4ff;
    }
    .mode-tab:hover:not(.active) { background: rgba(255,255,255,0.1); }
    .modal-content { margin-bottom: 20px; }
    .modal-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .modal-row:last-child { border-bottom: none; }
    .modal-label { font-size: 13px; color: #ccc; }
    .modal-row select {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      padding: 8px 12px;
      color: #fff;
      font-size: 13px;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .modal-btn {
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      border: none;
    }
    .modal-btn.primary {
      background: linear-gradient(90deg, #00d4ff, #0088ff);
      color: #fff;
    }
    .modal-btn.secondary {
      background: rgba(255,255,255,0.1);
      color: #888;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .settings-icon {
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .settings-icon:hover { color: #00d4ff; background: rgba(0,212,255,0.1); }
    .settings-icon svg { width: 18px; height: 18px; display: block; }

    /* Premium Realtime Page Styles */
    .realtime-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .realtime-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .realtime-header h2 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, #00d4ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .realtime-hero {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .hero-card {
      background: linear-gradient(145deg, #1e1e4a 0%, #2a2a6a 50%, #1e1e4a 100%);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid rgba(0,212,255,0.2);
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .hero-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #00d4ff, #00ff88, #00d4ff);
      background-size: 200% 100%;
      animation: shimmer 2s infinite linear;
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .hero-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0,212,255,0.2);
      border-color: rgba(0,212,255,0.4);
    }
    .hero-card .icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      font-size: 24px;
    }
    .hero-card .icon.users { background: linear-gradient(135deg, #00d4ff33, #00d4ff11); color: #00d4ff; }
    .hero-card .icon.connect { background: linear-gradient(135deg, #00ff8833, #00ff8811); color: #00ff88; }
    .hero-card .icon.p2p { background: linear-gradient(135deg, #ff6b6b33, #ff6b6b11); color: #ff6b6b; }
    .hero-card .label {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .hero-card .value {
      font-size: 42px;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, #00d4ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }
    .hero-card.green .value {
      background: linear-gradient(135deg, #fff 0%, #00ff88 100%);
      -webkit-background-clip: text;
    }
    .hero-card.orange .value {
      background: linear-gradient(135deg, #fff 0%, #ffa502 100%);
      -webkit-background-clip: text;
    }
    .hero-card .sub {
      font-size: 13px;
      color: #666;
      margin-top: 8px;
    }
    .realtime-section {
      background: linear-gradient(135deg, #16163a 0%, #1e1e4a 100%);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .realtime-section-title {
      font-size: 14px;
      font-weight: 600;
      color: #00d4ff;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .realtime-section-title::before {
      content: '';
      width: 4px;
      height: 16px;
      background: linear-gradient(180deg, #00d4ff, #0088ff);
      border-radius: 2px;
    }
    .realtime-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }
    .stat-card {
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.06);
      transition: all 0.2s ease;
    }
    .stat-card:hover {
      background: rgba(0,212,255,0.08);
      border-color: rgba(0,212,255,0.2);
    }
    .stat-card .stat-label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .stat-card .stat-value {
      font-size: 26px;
      font-weight: 700;
      color: #fff;
    }
    .stat-card .stat-percent {
      font-size: 12px;
      color: #00d4ff;
      margin-top: 4px;
    }
    .stat-card.mobile .stat-value { color: #00d4ff; }
    .stat-card.desktop .stat-value { color: #00ff88; }
    .stat-card.tablet .stat-value { color: #ffa502; }
    .stat-card.other .stat-value { color: #888; }
    .device-bar {
      display: flex;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 16px;
      background: rgba(0,0,0,0.3);
    }
    .device-bar .bar-segment {
      height: 100%;
      transition: width 0.5s ease;
    }
    .device-bar .bar-mobile { background: linear-gradient(90deg, #00d4ff, #0088ff); }
    .device-bar .bar-desktop { background: linear-gradient(90deg, #00ff88, #00cc6a); }
    .device-bar .bar-tablet { background: linear-gradient(90deg, #ffa502, #ff6b6b); }
    .device-bar .bar-other { background: #444; }
    .player-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .player-card {
      background: linear-gradient(135deg, rgba(0,212,255,0.1) 0%, rgba(0,136,255,0.05) 100%);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid rgba(0,212,255,0.15);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .player-card .player-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, #00d4ff22, #00d4ff11);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #00d4ff;
    }
    .player-card .player-info .player-name {
      font-size: 13px;
      color: #888;
      margin-bottom: 4px;
    }
    .player-card .player-info .player-count {
      font-size: 32px;
      font-weight: 700;
      color: #fff;
    }
    .player-card.p2 {
      background: linear-gradient(135deg, rgba(0,255,136,0.1) 0%, rgba(0,204,106,0.05) 100%);
      border-color: rgba(0,255,136,0.15);
    }
    .player-card.p2 .player-icon {
      background: linear-gradient(135deg, #00ff8822, #00ff8811);
      color: #00ff88;
    }
    .compact-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .compact-item {
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
    }
    .compact-item:hover {
      background: rgba(0,212,255,0.08);
      border-color: rgba(0,212,255,0.2);
    }
    .compact-item .item-name {
      font-size: 12px;
      color: #ccc;
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .compact-item .item-count {
      font-size: 14px;
      font-weight: 600;
      color: #00d4ff;
    }
    @media (max-width: 900px) {
      .realtime-hero { grid-template-columns: 1fr; }
      .player-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <h1>P2P Stats</h1>
    <ul class="menu">
      <li class="menu-item"><a href="#dashboard" class="active">Dashboard</a></li>
      <li class="menu-item"><a href="#traffic">트래픽</a></li>
      <li class="menu-item"><a href="#realtime">실시간</a></li>
      <li class="menu-item"><a href="#sessions">접속자</a></li>
      <li class="menu-item"><a href="#players">플레이어</a></li>
      <li class="menu-item"><a href="#live">시청 중</a></li>
      <li class="menu-item"><a href="#popular">인기파일</a></li>
      <li class="menu-item"><a href="#charts">원형통계</a></li>
      <li class="menu-item"><a href="#summary">종합통계</a></li>

      <div style="color:#666;margin-bottom:4px">서버시간 (KST)</div>
      <div id="serverTimeClock" style="color:#00d4ff;font-size:14px;font-weight:bold">--:--:--</div>
      <div id="serverTimeDate" style="color:#aaa;margin-top:2px">----.--.--</div>
    </div>
  </aside>

  <main class="main" id="app"></main>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">페이지 설정</h3>

        <div class="mode-tab active" data-mode="realtime" onclick="selectMode('realtime')">실시간</div>

      </div>

      <div class="modal-actions">
        <button class="modal-btn secondary" onclick="closeModal()">취소</button>
        <button class="modal-btn primary" onclick="saveModalSettings()">저장</button>
      </div>
    </div>
  </div>

<script>
const app = document.getElementById('app');
let page = 'dashboard';
let chart = null;
const history = { labels: [], viewers: [], uniqueUsers: [], http: [], p2p: [] };
let activeInterval = null; // 현재 활성 인터벌 트래킹

// ============================================
// 서버시간 (KST) 공통 유틸리티
// ============================================
let serverTimeOffset = 9 * 60; // KST offset in minutes (UTC+9)
let serverTimeDiff = 0; // 서버시간과 클라이언트시간 차이 (ms)

// 서버시간 동기화
async function syncServerTime() {
  try {
    const res = await fetch('/api/server-time');
    const data = await res.json();
    const serverTs = data.timestamp;
    const clientTs = Date.now();
    serverTimeDiff = serverTs - clientTs;
    serverTimeOffset = data.offset * 60; // 분 단위
    console.log('[ServerTime] Synced, diff:', serverTimeDiff, 'ms');
  } catch (e) {
    console.error('[ServerTime] Sync failed:', e);
  }
}

// 현재 서버시간 가져오기
function getServerTime() {
  return new Date(Date.now() + serverTimeDiff);
}

// UTC 타임스탬프를 서버시간(KST)으로 변환
function toServerTime(utcString) {
  const d = new Date(utcString);
  // UTC를 KST로 변환 (UTC + 9시간)
  return new Date(d.getTime() + serverTimeOffset * 60 * 1000);
}

// 서버시간 기준 날짜 포맷 (월/일)
function formatServerDate(utcString) {
  const d = toServerTime(utcString);
  const days = ['일', '월', '화', '수', '목', '금', '토'];
  const dayName = days[d.getUTCDay()];
  return `${d.getUTCMonth() + 1}/${d.getUTCDate()}(${dayName})`;
}

// 서버시간 기준 시간 포맷 (HH:mm)
function formatServerTime(utcString) {
  const d = toServerTime(utcString);
  return `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`;
}

// 서버시간 기준 날짜+시간 포맷
function formatServerDateTime(utcString) {
  const d = toServerTime(utcString);
  return `${d.getUTCMonth()+1}/${d.getUTCDate()} ${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`;
}

// 서버시간 기준 날짜만 포맷 (7d/30d용) - 요일 포함
function formatServerDate(utcString) {
  const d = toServerTime(utcString);
  const days = ['일', '월', '화', '수', '목', '금', '토'];
  const dayName = days[d.getUTCDay()];
  return `${d.getUTCMonth()+1}/${d.getUTCDate()}(${dayName})`;
}

// 서버시간 기준 월/일/시 추출
function getServerDateParts(utcString) {
  const d = toServerTime(utcString);
  return {
    year: d.getUTCFullYear(),
    month: d.getUTCMonth() + 1,
    day: d.getUTCDate(),
    hour: d.getUTCHours(),
    minute: d.getUTCMinutes()
  };
}

// 서버시간 시계 업데이트 (KST = UTC+9)
function updateServerTimeClock() {
  // UTC 기준으로 KST 계산
  const now = new Date(Date.now() + serverTimeDiff);
  const kst = new Date(now.getTime() + serverTimeOffset * 60 * 1000);

  const h = String(kst.getUTCHours()).padStart(2, '0');
  const m = String(kst.getUTCMinutes()).padStart(2, '0');
  const s = String(kst.getUTCSeconds()).padStart(2, '0');
  const y = kst.getUTCFullYear();
  const mon = String(kst.getUTCMonth() + 1).padStart(2, '0');
  const d = String(kst.getUTCDate()).padStart(2, '0');

  const clockEl = document.getElementById('serverTimeClock');
  const dateEl = document.getElementById('serverTimeDate');
  if (clockEl) clockEl.textContent = `${h}:${m}:${s}`;
  if (dateEl) dateEl.textContent = `${y}.${mon}.${d}`;
}

// 서버시간 초기화
syncServerTime().then(() => updateServerTimeClock());
setInterval(syncServerTime, 60000); // 1분마다 동기화
setInterval(updateServerTimeClock, 1000); // 1초마다 시계 업데이트

function clearActiveInterval() {
  if (activeInterval) {
    clearInterval(activeInterval);
    activeInterval = null;
  }
}

function setActiveInterval(fn, ms) {
  clearActiveInterval();
  console.log(`[Interval] Setting interval: ${ms}ms for page: ${page}`);
  if (ms > 0) activeInterval = setInterval(fn, ms);
}

// Settings & Cache
const defaultSettings = {
  dashboard: { mode: 'realtime', realtimeInterval: 3000, cacheMinutes: 5 },
  traffic: { mode: 'realtime', realtimeInterval: 5000, cacheMinutes: 5 },
  realtime: { mode: 'realtime', realtimeInterval: 3000, cacheMinutes: 5 },
  sessions: { mode: 'realtime', realtimeInterval: 5000, cacheMinutes: 5 },
  players: { mode: 'realtime', realtimeInterval: 3000, cacheMinutes: 5 },
  live: { mode: 'realtime', realtimeInterval: 3000, cacheMinutes: 5 },
  charts: { mode: 'realtime', realtimeInterval: 5000, cacheMinutes: 10 },
  popular: { mode: 'realtime', realtimeInterval: 10000, cacheMinutes: 10 },
  summary: { mode: 'realtime', realtimeInterval: 30000, cacheMinutes: 10 },
  visitors: { mode: 'realtime', realtimeInterval: 10000, cacheMinutes: 5 },
  history: { mode: 'cache', realtimeInterval: 30000, cacheMinutes: 10 }
};

// Merge stored settings with defaults (deep merge per page)
const storedSettings = JSON.parse(localStorage.getItem('p2p-settings-v3') || '{}');
let settings = {};
for (const page in defaultSettings) {
  settings[page] = { ...defaultSettings[page], ...storedSettings[page] };
}

// Modal functions
let currentModalPage = null;

function openModal(pageName) {
  currentModalPage = pageName;
  const pageSettings = settings[pageName] || defaultSettings[pageName] || { mode: 'realtime', realtimeInterval: 3000, cacheMinutes: 5 };

  document.getElementById('modalTitle').textContent = getPageTitle(pageName) + ' 설정';

  // Set mode tabs
  document.querySelectorAll('.mode-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.mode === pageSettings.mode);
  });

  // Set content based on mode
  updateModalContent(pageSettings);

  document.getElementById('settingsModal').classList.add('show');
}

function closeModal() {
  document.getElementById('settingsModal').classList.remove('show');
  currentModalPage = null;
}

function selectMode(mode) {
  document.querySelectorAll('.mode-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.mode === mode);
  });

  const pageSettings = settings[currentModalPage] || defaultSettings[currentModalPage];
  const tempSettings = { ...pageSettings, mode };
  updateModalContent(tempSettings);
}

function updateModalContent(pageSettings) {
  const modal = document.getElementById('modalContent');
  if (pageSettings.mode === 'realtime') {
    modal.innerHTML = `
      <div class="modal-row">
        <span class="modal-label">갱신 주기</span>
        <select id="modalInterval">
          <option value="1000" ${pageSettings.realtimeInterval===1000?'selected':''}>1초</option>
          <option value="2000" ${pageSettings.realtimeInterval===2000?'selected':''}>2초</option>
          <option value="3000" ${pageSettings.realtimeInterval===3000?'selected':''}>3초</option>
          <option value="5000" ${pageSettings.realtimeInterval===5000?'selected':''}>5초</option>
          <option value="10000" ${pageSettings.realtimeInterval===10000?'selected':''}>10초</option>
          <option value="30000" ${pageSettings.realtimeInterval===30000?'selected':''}>30초</option>
        </select>
      </div>`;
  } else {
    modal.innerHTML = `
      <div class="modal-row">
        <span class="modal-label">캐시 유지 시간</span>
        <select id="modalCacheMinutes">
          <option value="1" ${pageSettings.cacheMinutes===1?'selected':''}>1분</option>
          <option value="3" ${pageSettings.cacheMinutes===3?'selected':''}>3분</option>
          <option value="5" ${pageSettings.cacheMinutes===5?'selected':''}>5분</option>
          <option value="10" ${pageSettings.cacheMinutes===10?'selected':''}>10분</option>
          <option value="30" ${pageSettings.cacheMinutes===30?'selected':''}>30분</option>
          <option value="60" ${pageSettings.cacheMinutes===60?'selected':''}>1시간</option>
        </select>
      </div>
      <div style="font-size:11px;color:#888;margin-top:8px">캐시된 데이터를 유지하는 시간입니다. 수동 새로고침 시에만 데이터가 갱신됩니다.</div>`;
  }
}

function saveModalSettings() {
  if (!currentModalPage) return;

  const mode = document.querySelector('.mode-tab.active').dataset.mode;

  if (!settings[currentModalPage]) {
    settings[currentModalPage] = { ...defaultSettings[currentModalPage] };
  }

  settings[currentModalPage].mode = mode;
  if (mode === 'realtime') {
    const interval = parseInt(document.getElementById('modalInterval').value);
    settings[currentModalPage].realtimeInterval = interval;
  } else {
    const cacheMinutes = parseInt(document.getElementById('modalCacheMinutes').value);
    settings[currentModalPage].cacheMinutes = cacheMinutes;
  }

  localStorage.setItem('p2p-settings-v3', JSON.stringify(settings));
  showToast('설정이 저장되었습니다');
  closeModal();

  // Reload current page to apply settings
  nav(page);
}

function getPageTitle(p) {
  const titles = {
    dashboard: 'Dashboard',
    realtime: '실시간',
    sessions: '접속자',
    players: '플레이어',
    live: '시청 중',
    charts: '원형통계',
    analysis: 'IP분석',
    history: '히스토리'
  };
  return titles[p] || p;
}

function getPageInterval(pageName) {
  const ps = settings[pageName] || defaultSettings[pageName];
  if (!ps) return 3000;
  // Cache mode: return 0 (no auto-refresh)
  const interval = ps.mode === 'realtime' ? ps.realtimeInterval : 0;
  console.log(`[getPageInterval] ${pageName}: mode=${ps.mode}, interval=${interval}ms`);
  return interval;
}

function isPageCaching(pageName) {
  const ps = settings[pageName] || defaultSettings[pageName];
  return ps?.mode === 'cache';
}

// Settings button SVG
const settingsIconSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`;

function settingsBtn(pageName) {
  return `<button class="settings-icon" onclick="openModal('${pageName}')" title="설정">${settingsIconSvg}</button>`;
}

// 페이지별 캐시 상태 저장
const cacheStatus = {};

function modeIndicator(pageName) {
  const ps = settings[pageName] || defaultSettings[pageName];
  const mode = ps?.mode || 'realtime';
  const color = mode === 'realtime' ? '#00ff88' : '#ffa502';
  if (mode === 'realtime') {
    const interval = ps?.realtimeInterval || 3000;
    return `<span style="font-size:11px;color:${color};padding:4px 8px;background:rgba(255,255,255,0.05);border-radius:4px">실시간 ${interval/1000}초</span>`;
  } else {
    const minutes = ps?.cacheMinutes || 5;
    return `<span style="font-size:11px;color:${color};padding:4px 8px;background:rgba(255,255,255,0.05);border-radius:4px">캐싱 ${minutes}분</span><span id="cacheInfo" style="font-size:11px;margin-left:8px;padding:4px 8px;background:rgba(255,255,255,0.05);border-radius:4px"></span>`;
  }
}

function updateCacheInfo(pageName, isHit, time) {
  cacheStatus[pageName] = { isHit, time };
  const el = document.getElementById('cacheInfo');
  if (el) {
    const hitColor = isHit ? '#00ff88' : '#ff6b6b';
    const hitText = isHit ? 'HIT' : 'MISS';
    const timeStr = time.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    el.innerHTML = `<span style="color:${hitColor}">${hitText}</span> <span style="color:#888">${timeStr}</span>`;
  }
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2000);
}

// 클라이언트 캐시 (페이지 즉시 표시용)
const clientCache = {};

function getClientCache(cacheKey) {
  const cached = clientCache[cacheKey];
  if (!cached) return null;
  const ps = settings[page] || defaultSettings[page];
  const ttlMs = (ps?.cacheMinutes || 5) * 60 * 1000;
  if (Date.now() - cached.time > ttlMs) return null;
  return cached.data;
}

function setClientCache(cacheKey, data) {
  clientCache[cacheKey] = { data, time: Date.now() };
}

async function fetchWithCache(endpoint, pageKey) {
  const ps = settings[pageKey] || defaultSettings[pageKey];
  const useCache = ps?.mode === 'cache';
  const cacheMinutes = ps?.cacheMinutes || 5;
  const cacheKey = `${pageKey}:${endpoint}`;

  // 캐싱 모드면 서버에 cache 파라미터 전달, 실시간이면 브라우저 캐시 방지
  let url = endpoint;
  const sep = endpoint.includes('?') ? '&' : '?';
  if (useCache) {
    url = `${endpoint}${sep}cache=${cacheMinutes}`;
  } else {
    url = `${endpoint}${sep}_t=${Date.now()}`;
  }

  const r = await fetch(url);

  // 캐시 상태 업데이트
  if (useCache) {
    const xCache = r.headers.get('x-cache');
    const isHit = xCache === 'HIT';
    updateCacheInfo(pageKey, isHit, new Date());
  }

  const data = await r.json();

  // 클라이언트 캐시 저장
  if (useCache) {
    setClientCache(cacheKey, data);
  }

  return data;
}

// 캐시된 데이터로 즉시 렌더링 (있으면)
function getCachedData(endpoint, pageKey) {
  const ps = settings[pageKey] || defaultSettings[pageKey];
  if (ps?.mode !== 'cache') return null;
  return getClientCache(`${pageKey}:${endpoint}`);
}

// 공통 로드 함수: 캐시 있으면 즉시 렌더, 없으면 fetch
async function loadWithCache(endpoint, pageKey, renderFn) {
  const cached = getCachedData(endpoint, pageKey);
  if (cached) {
    renderFn(cached);
    updateCacheInfo(pageKey, true, new Date());
    return cached;
  }
  const data = await fetchWithCache(endpoint, pageKey);
  renderFn(data);
  return data;
}

function formatBytes(b) {
  if (!b || b < 0) return '0 B';
  const u = ['B','KB','MB','GB','TB','PB','EB'];
  let i = Math.floor(Math.log(b) / Math.log(1024));
  if (i >= u.length) i = u.length - 1;
  return (b / Math.pow(1024, i)).toFixed(i > 2 ? 2 : 1) + ' ' + u[i];
}

function card(title, val, unit = '', cls = '') {
  return `<div class="card ${cls}"><h3>${title}</h3><div class="val">${val}<span class="unit">${unit}</span></div></div>`;
}

const pages = {
  dashboard: () => `
    <div class="header"><h2>Dashboard</h2><div class="header-right">${modeIndicator('dashboard')}${settingsBtn('dashboard')}<div id="status" class="status ok">Connected</div></div></div>
    <div class="stats-grid" id="stats"></div>
    <div class="panel"><h3>실시간 트래픽</h3><canvas id="chart"></canvas></div>
  `,

      <div class="header-right">
        <div style="display:flex;gap:8px;margin-right:15px">
          <button class="period-btn" data-period="realtime" style="padding:6px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.2);border-radius:4px;color:#888;cursor:pointer;font-size:12px">⚡실시간</button>
          <button class="period-btn" data-period="1h" style="padding:6px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.2);border-radius:4px;color:#888;cursor:pointer;font-size:12px">1시간</button>
          <button class="period-btn" data-period="6h" style="padding:6px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.2);border-radius:4px;color:#888;cursor:pointer;font-size:12px">6시간</button>
          <button class="period-btn active" data-period="24h" style="padding:6px 12px;background:#00d4ff;border:1px solid #00d4ff;border-radius:4px;color:#fff;cursor:pointer;font-size:12px">24시간</button>
          <button class="period-btn" data-period="7d" style="padding:6px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.2);border-radius:4px;color:#888;cursor:pointer;font-size:12px">7일</button>
          <button class="period-btn" data-period="30d" style="padding:6px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.2);border-radius:4px;color:#888;cursor:pointer;font-size:12px">30일</button>
        </div>
        ${modeIndicator('traffic')}${settingsBtn('traffic')}
      </div>
    </div>
    <div class="stats-grid" id="trafficSummary"></div>
    <div class="panel" style="background:linear-gradient(135deg,rgba(0,212,255,.08),rgba(0,255,136,.05));border:1px solid rgba(0,212,255,.3)">
      <h3 style="color:#00d4ff;margin-bottom:15px">트래픽 추이</h3>
      <canvas id="trafficChart" height="280"></canvas>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px">
      <div class="panel" style="background:linear-gradient(135deg,rgba(255,107,107,.08),rgba(0,255,136,.05));border:1px solid rgba(255,107,107,.3)">
        <h3 style="color:#ff6b6b;margin-bottom:15px">트래픽 비율</h3>
        <canvas id="trafficPieChart" height="220"></canvas>
      </div>
      <div class="panel" style="background:linear-gradient(135deg,rgba(138,43,226,.08),rgba(255,165,0,.05));border:1px solid rgba(138,43,226,.3)">
        <h3 style="color:#8a2be2;margin-bottom:15px">CDN 서버별 접속자</h3>
        <canvas id="serverChart" height="220"></canvas>
      </div>
    </div>
    <div id="serverTrafficPanel" class="panel" style="margin-top:20px;background:linear-gradient(135deg,rgba(0,255,136,.08),rgba(0,212,255,.05));border:1px solid rgba(0,255,136,.3)">
      <h3 style="color:#00ff88;margin-bottom:15px">서버별 트래픽</h3>
      <canvas id="serverTrafficChart" height="280"></canvas>

function nav(p) {
  console.log('[nav] Navigating to:', p);
  clearActiveInterval(); // 페이지 전환 시 인터벌 정리
  page = p;
  document.querySelectorAll('.menu-item a').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + p));
  if (!pages[p]) {
    console.error('[nav] Page not found:', p);
    p = 'dashboard';
  }
  try {
    app.innerHTML = pages[p]();
  } catch(e) {
    console.error('[nav] Error rendering page:', e);
    return;
  }
  if (p === 'dashboard') initDashboard();
  else if (p === 'traffic') initTraffic();
  else if (p === 'realtime') initRealtime();
  else if (p === 'sessions') initSessions();
  else if (p === 'players') initPlayers();
  else if (p === 'live') initLive();
  else if (p === 'popular') initPopular();
  else if (p === 'charts') initCharts();
  else if (p === 'summary') initSummary();
  else if (p === 'analysis') initAnalysis();
  else if (p === 'visitors') initVisitors();
  else if (p === 'history') initHistory();
}

async function initDashboard() {
  let speedData = { httpGbps: '0', p2pGbps: '0', p2pUpGbps: '0' };
  function render(d) {
    if (d.error) { document.getElementById('status').className = 'status err'; document.getElementById('status').textContent = 'Offline'; return; }
    document.getElementById('status').className = 'status ok';
    document.getElementById('status').textContent = 'Connected';
    document.getElementById('stats').innerHTML = `
      ${card('고유 유저', d.total?.uniqueUsers || 0, '명')}
      ${card('연결 수', d.total?.viewers || 0, '개')}
      ${card('Swarms', d.activeSwarms || 0, '개')}
      ${card('P2P 효율', d.total?.p2pRatio || '0', '%', 'p2p')}
      ${card('HTTP', formatBytes(d.total?.httpBytes || 0), '', 'http')}
      ${card('P2P↓', formatBytes(d.total?.p2pBytes || 0), '', 'p2p')}
      ${card('P2P↑', formatBytes(d.total?.p2pUpBytes || 0), '', 'p2p')}
      ${card('HTTP 속도', speedData.httpGbps, ' GB/s', 'http')}
      ${card('P2P↓ 속도', speedData.p2pGbps, ' GB/s', 'p2p')}
      ${card('P2P↑ 속도', speedData.p2pUpGbps, ' GB/s', 'p2p')}
    `;
    // 서버시간(KST) 기준
    const now = getServerTime();
    const kst = new Date(now.getTime() + serverTimeOffset * 60 * 1000);
    const t = String(kst.getUTCHours()).padStart(2,'0') + ':' + String(kst.getUTCMinutes()).padStart(2,'0') + ':' + String(kst.getUTCSeconds()).padStart(2,'0');
    history.labels.push(t);
    history.viewers.push(d.total?.viewers || 0);
    history.uniqueUsers.push(d.total?.uniqueUsers || 0);
    history.http.push((d.total?.httpBytes || 0) / 1024 / 1024 / 1024 / 1024);
    history.p2p.push((d.total?.p2pBytes || 0) / 1024 / 1024 / 1024 / 1024);
    if (history.labels.length > 30) { history.labels.shift(); history.viewers.shift(); history.uniqueUsers.shift(); history.http.shift(); history.p2p.shift(); }
    if (chart) chart.update('none');
  }
  async function update() {
    try {
      // 속도 데이터 가져오기
      const trafficResp = await fetch('/api/traffic?period=realtime');
      const trafficData = await trafficResp.json();
      if (trafficData.totals) {
        speedData.httpGbps = trafficData.totals.httpGbps || '0';
        speedData.p2pGbps = trafficData.totals.p2pGbps || '0';
        speedData.p2pUpGbps = trafficData.totals.p2pUpGbps || '0';
      }
      await loadWithCache('/api/realtime', 'dashboard', render);
    } catch (e) { console.error(e); }
  }
  update();
  chart = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: { labels: history.labels, datasets: [
      { label: '고유 유저', data: history.uniqueUsers, borderColor: '#00d4ff', tension: 0.3, yAxisID: 'y1' },
      { label: 'HTTP', data: history.http, borderColor: '#ff6b6b', tension: 0.3, yAxisID: 'y' },
      { label: 'P2P Down', data: history.p2p, borderColor: '#00ff88', tension: 0.3, yAxisID: 'y' }
    ]},
    options: {
      responsive: true,
      animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { color: '#fff' } } },
      scales: {
        x: { display: false },
        y: { type: 'linear', position: 'left', ticks: { color: '#888' }, grid: { color: '#333' }, title: { display: true, text: 'TB', color: '#888' } },
        y1: { type: 'linear', position: 'right', ticks: { color: '#00d4ff' }, grid: { drawOnChartArea: false }, title: { display: true, text: '유저', color: '#00d4ff' } }
      }
    }
  });
  setActiveInterval(update, getPageInterval('dashboard'));
}

// 트래픽 페이지 차트 인스턴스
let trafficLineChart = null, trafficRatioPie = null, serverBarChart = null, serverTrafficChart = null;

function initTraffic() {
  let currentPeriod = '24h';

  // 페이지 전환 시 이전 차트 인스턴스 정리
  if (trafficLineChart) { trafficLineChart.destroy(); trafficLineChart = null; }
  if (trafficRatioPie) { trafficRatioPie.destroy(); trafficRatioPie = null; }
  if (serverBarChart) { serverBarChart.destroy(); serverBarChart = null; }
  if (serverTrafficChart) { serverTrafficChart.destroy(); serverTrafficChart = null; }

  function render(data, realtimeData = null) {
    const timeline = data.timeline || [];
    const totals = data.totals || {};
    const servers = data.servers || [];
    const isRealtime = currentPeriod === 'realtime';

    // 요약 카드 - 실시간이면 현재 상태, 아니면 기간 총합
    if (isRealtime && realtimeData) {
      const rt = realtimeData;
      const httpBytes = (rt.player1?.httpBytes || 0) + (rt.player2?.httpBytes || 0);
      const p2pBytes = (rt.player1?.p2pBytes || 0) + (rt.player2?.p2pBytes || 0);
      const p2pUpBytes = (rt.player1?.p2pUpBytes || 0) + (rt.player2?.p2pUpBytes || 0);
      const totalTraffic = httpBytes + p2pBytes;
      const p2pRatio = totalTraffic > 0 ? ((p2pBytes / totalTraffic) * 100).toFixed(1) : '0';
      const httpGbps = totals.httpGbps || '0';
      const p2pGbps = totals.p2pGbps || '0';
      const p2pUpGbps = totals.p2pUpGbps || '0';

      document.getElementById('trafficSummary').innerHTML = `
        ${card('현재 시청자', (rt.total?.viewers || 0).toLocaleString(), '명', 'http')}
        ${card('현재 피어', (rt.total?.peers || 0).toLocaleString(), '개', 'p2p')}
        ${card('활성 스웜', (rt.activeSwarms || 0).toLocaleString(), '개', 'p2p')}
        ${card('P2P 비율', p2pRatio, '%', 'p2p')}
        ${card('HTTP 속도', httpGbps, ' GB/s', 'http')}
        ${card('P2P↓ 속도', p2pGbps, ' GB/s', 'p2p')}
        ${card('P2P↑ 속도', p2pUpGbps, ' GB/s', 'p2p')}
      `;

      // 피크 대신 현재 값
      document.getElementById('peakViewers').textContent = (rt.total?.viewers || 0).toLocaleString();
      document.getElementById('peakUsers').textContent = (rt.total?.uniqueUsers || 0).toLocaleString();
      document.getElementById('peakPeers').textContent = (rt.total?.peers || 0).toLocaleString();
      document.getElementById('peakSwarms').textContent = (rt.activeSwarms || 0).toLocaleString();
    } else {
      const totalHttp = totals.totalHttp || 0;
      const totalP2p = totals.totalP2p || 0;
      const totalP2pUp = totals.totalP2pUp || 0;
      const totalTraffic = totalHttp + totalP2p;
      const p2pRatio = totalTraffic > 0 ? ((totalP2p / totalTraffic) * 100).toFixed(1) : '0';

      const httpGbps = totals.httpGbps || '0';
      const p2pGbps = totals.p2pGbps || '0';
      const p2pUpGbps = totals.p2pUpGbps || '0';
      document.getElementById('trafficSummary').innerHTML = `
        ${card('HTTP 트래픽', formatBytes(totalHttp), '', 'http')}
        ${card('P2P 다운로드', formatBytes(totalP2p), '', 'p2p')}
        ${card('P2P 업로드', formatBytes(totalP2pUp), '', 'p2p')}
        ${card('P2P 비율', p2pRatio, '%', 'p2p')}
        ${card('HTTP 속도', httpGbps, ' GB/s', 'http')}
        ${card('P2P↓ 속도', p2pGbps, ' GB/s', 'p2p')}
        ${card('P2P↑ 속도', p2pUpGbps, ' GB/s', 'p2p')}
      `;

      // 피크 지표
      document.getElementById('peakViewers').textContent = (totals.peakViewers || 0).toLocaleString();
      document.getElementById('peakUsers').textContent = (totals.peakUsers || 0).toLocaleString();
      document.getElementById('peakPeers').textContent = (totals.peakPeers || 0).toLocaleString();
      document.getElementById('peakSwarms').textContent = (totals.peakSwarms || 0).toLocaleString();
    }

    // 트래픽 추이 차트 (서버시간 KST) - 7d/30d는 날짜, 나머지는 시간
    const isDailyPeriod = ['7d', '30d'].includes(currentPeriod);
    const labels = timeline.map(t => isDailyPeriod ? formatServerDate(t.ts) : formatServerTime(t.ts));
    const httpData = timeline.map(t => (t.httpBytes || 0) / 1024 / 1024 / 1024 / 1024); // TB
    const p2pData = timeline.map(t => (t.p2pBytes || 0) / 1024 / 1024 / 1024 / 1024);
    const viewersData = timeline.map(t => t.viewers || 0);

    if (!trafficLineChart) {
      trafficLineChart = new Chart(document.getElementById('trafficChart'), {
        type: 'line',
        data: {
          labels,
          datasets: [
            { label: 'HTTP (TB)', data: httpData, borderColor: '#ff6b6b', backgroundColor: 'rgba(255,107,107,.1)', fill: true, tension: 0.4, yAxisID: 'y' },
            { label: 'P2P (TB)', data: p2pData, borderColor: '#00ff88', backgroundColor: 'rgba(0,255,136,.1)', fill: true, tension: 0.4, yAxisID: 'y' },
            { label: '시청자', data: viewersData, borderColor: '#00d4ff', borderDash: [5,5], fill: false, tension: 0.4, yAxisID: 'y1' }
          ]
        },
        options: {
          responsive: true,
          interaction: { mode: 'index', intersect: false },
          plugins: { legend: { labels: { color: '#fff' } } },
          scales: {
            x: { ticks: { color: '#888', maxRotation: 0 }, grid: { color: '#333' } },
            y: { type: 'linear', position: 'left', ticks: { color: '#888' }, grid: { color: '#333' }, title: { display: true, text: 'TB', color: '#888' } },
            y1: { type: 'linear', position: 'right', ticks: { color: '#00d4ff' }, grid: { drawOnChartArea: false }, title: { display: true, text: '시청자', color: '#00d4ff' } }
          }
        }
      });
    } else {
      trafficLineChart.data.labels = labels;
      trafficLineChart.data.datasets[0].data = httpData;
      trafficLineChart.data.datasets[1].data = p2pData;
      trafficLineChart.data.datasets[2].data = viewersData;
      trafficLineChart.update('none');
    }

    // 트래픽 비율 파이 차트 - 실시간이면 현재 트래픽 비율
    let pieHttp, pieP2p, pieP2pUp;
    if (isRealtime && realtimeData) {
      pieHttp = (realtimeData.player1?.httpBytes || 0) + (realtimeData.player2?.httpBytes || 0);
      pieP2p = (realtimeData.player1?.p2pBytes || 0) + (realtimeData.player2?.p2pBytes || 0);
      pieP2pUp = (realtimeData.player1?.p2pUpBytes || 0) + (realtimeData.player2?.p2pUpBytes || 0);
    } else {
      pieHttp = totals.totalHttp || 0;
      pieP2p = totals.totalP2p || 0;
      pieP2pUp = totals.totalP2pUp || 0;
    }

    if (!trafficRatioPie) {
      trafficRatioPie = new Chart(document.getElementById('trafficPieChart'), {
        type: 'doughnut',
        data: {
          labels: ['HTTP', 'P2P 다운', 'P2P 업로드'],
          datasets: [{ data: [pieHttp, pieP2p, pieP2pUp], backgroundColor: ['#ff6b6b', '#00ff88', '#00d4ff'] }]
        },
        options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#fff', padding: 15 } } } }
      });
    } else {
      trafficRatioPie.data.datasets[0].data = [pieHttp, pieP2p, pieP2pUp];
      trafficRatioPie.update('none');
    }

    // 서버별 바 차트 - 실시간이면 현재 플레이어 시청자
    let barLabels, barData;
    if (isRealtime && realtimeData) {
      barLabels = ['Player 1', 'Player 2'];
      barData = [
        (realtimeData.player1?.viewers || 0) / 1000,
        (realtimeData.player2?.viewers || 0) / 1000
      ];
    } else {
      const cdnServers = servers.filter(s => s.visitors);
      barLabels = cdnServers.map(s => s.server.replace(/^every/, ''));
      barData = cdnServers.map(s => (s.visitors || 0) / 1000);
    }

    if (!serverBarChart) {
      serverBarChart = new Chart(document.getElementById('serverChart'), {
        type: 'bar',
        data: {
          labels: barLabels,
          datasets: [
            { label: '접속자 (천명)', data: barData, backgroundColor: ['#ff6b6b','#00ff88','#00d4ff','#ffa500','#8a2be2','#ff69b4','#32cd32','#ff4500','#1e90ff'] }
          ]
        },
        options: {
          responsive: true,
          indexAxis: 'y',
          plugins: { legend: { display: false } },
          scales: { x: { ticks: { color: '#888' }, grid: { color: '#333' } }, y: { ticks: { color: '#fff' }, grid: { display: false } } }
        }
      });
    } else {
      serverBarChart.data.labels = barLabels;
      serverBarChart.data.datasets[0].data = barData;
      serverBarChart.update('none');
    }

    // 서버별 테이블 - 모든 기간에서 servers 데이터 사용
    let totalHttp = 0, totalP2p = 0, totalP2pUp = 0, totalViewers = 0;
    let totalHttpGbps = 0, totalP2pGbps = 0, totalP2pUpGbps = 0;
    const rows = servers.map(s => {
      const isPlayer = s.server.startsWith('Player');
      const displayName = s.server.replace(/^every/, '');
      const http = s.http || 0, p2p = s.p2p || 0, p2pUp = s.p2pUp || 0;
      const httpGbps = parseFloat(s.httpGbps) || 0, p2pGbps = parseFloat(s.p2pGbps) || 0, p2pUpGbps = parseFloat(s.p2pUpGbps) || 0;
      const total = http + p2p;
      const hasTraffic = total > 0;
      const p2pRatio = hasTraffic ? (p2p / total * 100).toFixed(1) : 0;
      const color = isPlayer ? '#ffa500' : '#8a2be2';
      const viewers = s.viewers || s.visitors || 0;
      totalHttp += http; totalP2p += p2p; totalP2pUp += p2pUp; totalViewers += viewers;
      totalHttpGbps += httpGbps; totalP2pGbps += p2pGbps; totalP2pUpGbps += p2pUpGbps;
      return `<tr><td><b style="color:${color}">${displayName}</b></td><td style="color:#ff6b6b">${hasTraffic ? formatBytes(http) : '-'}</td><td style="color:#00ff88">${hasTraffic ? formatBytes(p2p) : '-'}</td><td style="color:#88ff00">${p2pUp > 0 ? formatBytes(p2pUp) : '-'}</td><td style="color:#ff6b6b">${httpGbps.toFixed(2)} GB/s</td><td style="color:#00ff88">${p2pGbps.toFixed(2)} GB/s</td><td style="color:#88ff00">${p2pUpGbps.toFixed(2)} GB/s</td><td style="color:#00ff88;font-weight:bold">${hasTraffic ? p2pRatio + '%' : '-'}</td><td style="color:#00d4ff">${viewers.toLocaleString()}</td></tr>`;
    }).join('');
    const totalP2pRatio = (totalHttp + totalP2p) > 0 ? (totalP2p / (totalHttp + totalP2p) * 100).toFixed(1) : 0;
    const totalRow = servers.length > 0 ? `<tr style="background:rgba(0,212,255,0.1);font-weight:bold;border-top:2px solid rgba(255,255,255,0.3)"><td>합계</td><td style="color:#ff6b6b">${formatBytes(totalHttp)}</td><td style="color:#00ff88">${formatBytes(totalP2p)}</td><td style="color:#88ff00">${formatBytes(totalP2pUp)}</td><td style="color:#ff6b6b">${totalHttpGbps.toFixed(2)} GB/s</td><td style="color:#00ff88">${totalP2pGbps.toFixed(2)} GB/s</td><td style="color:#88ff00">${totalP2pUpGbps.toFixed(2)} GB/s</td><td style="color:#00ff88">${totalP2pRatio}%</td><td style="color:#00d4ff">${totalViewers.toLocaleString()}</td></tr>` : '';
    document.querySelector('#serverTable tbody').innerHTML = (rows + totalRow) || '<tr><td colspan="9" style="text-align:center">데이터 없음</td></tr>';
  }

  async function load() {
    try {
      const isRealtime = currentPeriod === 'realtime';
      const [trafficResp, realtimeResp] = await Promise.all([
        fetch(`/api/traffic?period=${currentPeriod}`),
        isRealtime ? fetch('/api/realtime') : Promise.resolve(null)
      ]);
      const data = await trafficResp.json();
      const realtimeData = isRealtime && realtimeResp ? await realtimeResp.json() : null;
      render(data, realtimeData);
    } catch (e) { console.error(e); }
  }

  // 서버별 트래픽 차트 (기간 연동)
  async function loadServerTraffic() {
    try {
      const panel = document.getElementById('serverTrafficPanel');
      if (panel) panel.style.display = 'block';

      const resp = await fetch(`/api/servers/realtime?period=${currentPeriod}`);
      const data = await resp.json();
      if (!data || !data.servers || Object.keys(data.servers).length === 0) return;

      const colors = ['#ff6b6b','#00ff88','#00d4ff','#ffa500','#8a2be2','#ff69b4','#32cd32','#ff4500','#1e90ff','#ffff00','#ff1493'];
      const datasets = [];
      let idx = 0;

      // 모든 서버의 타임스탬프 통합
      const allTimestamps = new Set();
      for (const serverData of Object.values(data.servers)) {
        for (const point of serverData) {
          if (point.ts) allTimestamps.add(point.ts);
        }
      }
      const sortedTs = Array.from(allTimestamps).sort();

      // 기간에 따른 시간 포맷 (서버시간 KST)
      const isLongPeriod = ['7d', '30d'].includes(currentPeriod);
      const labels = sortedTs.map(ts => {
        if (isLongPeriod) {
          return formatServerDateTime(ts);
        }
        return formatServerTime(ts);
      });

      // 서버명 정렬 (숫자순)
      const serverNames = Object.keys(data.servers).sort((a, b) => {
        const numA = parseInt(a.replace(/\D/g, '')) || 0;
        const numB = parseInt(b.replace(/\D/g, '')) || 0;
        return numA - numB;
      });

      for (const server of serverNames) {
        const serverData = data.servers[server];
        // "every" 제거하고 숫자만 표시
        const displayName = server.replace(/^every/, '');

        // 타임스탬프 기준으로 데이터 매핑
        const tsMap = {};
        for (const point of serverData) {
          tsMap[point.ts] = point.http || 0;
        }
        const httpData = sortedTs.map(ts => (tsMap[ts] || 0) / 1024 / 1024); // MB로 변환

        datasets.push({
          label: displayName,
          data: httpData,
          borderColor: colors[idx % colors.length],
          backgroundColor: colors[idx % colors.length] + '20',
          fill: false,
          tension: 0.4,
          pointRadius: currentPeriod === 'realtime' ? 2 : 1
        });
        idx++;
      }

      if (!serverTrafficChart) {
        serverTrafficChart = new Chart(document.getElementById('serverTrafficChart'), {
          type: 'line',
          data: { labels, datasets },
          options: {
            responsive: true,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: { position: 'top', labels: { color: '#fff', boxWidth: 15, padding: 10 } },
              tooltip: { callbacks: { label: ctx => {
                const v = ctx.parsed.y;
                const formatted = v >= 1000 ? (v/1000).toFixed(2) + ' GB' : v.toFixed(2) + ' MB';
                return `${ctx.dataset.label}: ${formatted}`;
              } } }
            },
            scales: {
              x: { ticks: { color: '#888', maxRotation: 0, maxTicksLimit: 12 }, grid: { color: '#333' } },
              y: {
                type: 'logarithmic',
                ticks: {
                  color: '#888',
                  callback: v => v >= 1000 ? (v/1000).toFixed(0) + 'GB' : v.toFixed(0) + 'MB'
                },
                grid: { color: '#333' },
                title: { display: true, text: '트래픽 (로그 스케일)', color: '#888' }
              }
            }
          }
        });
      } else {
        serverTrafficChart.data.labels = labels;
        serverTrafficChart.data.datasets = datasets;
        serverTrafficChart.update('none');
      }
    } catch (e) { console.error('serverTraffic error:', e); }
  }

  // 기간 버튼 이벤트
  document.querySelectorAll('.period-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.period-btn').forEach(b => { b.style.background = 'rgba(255,255,255,.05)'; b.style.borderColor = 'rgba(255,255,255,.2)'; b.style.color = '#888'; });
      btn.style.background = '#00d4ff'; btn.style.borderColor = '#00d4ff'; btn.style.color = '#fff';
      currentPeriod = btn.dataset.period;
      load();
      loadServerTraffic();

      // 실시간일 때는 1초 갱신, 아니면 기본 주기
      const interval = currentPeriod === 'realtime' ? 1000 : getPageInterval('traffic');
      setActiveInterval(() => { load(); loadServerTraffic(); }, interval);
    };
  });

  load();
  loadServerTraffic();
  setActiveInterval(() => { load(); loadServerTraffic(); }, getPageInterval('traffic'));
}

async function initRealtime() {
  function heroCard(icon, iconClass, label, value, colorClass = '') {
    return `<div class="hero-card ${colorClass}">
      <div class="icon ${iconClass}">${icon}</div>
      <div class="label">${label}</div>
      <div class="value">${value}</div>
    </div>`;
  }
  function playerCard(name, count, cls = '') {
    const icon = cls === 'p2' ? '▶' : '▷';
    return `<div class="player-card ${cls}">
      <div class="player-icon">${icon}</div>
      <div class="player-info"><div class="player-name">${name}</div><div class="player-count">${count}</div></div>
    </div>`;
  }
  function statCard(label, value, percent, cls = '') {
    return `<div class="stat-card ${cls}">
      <div class="stat-label">${label}</div>
      <div class="stat-value">${value}</div>
      ${percent ? `<div class="stat-percent">${percent}</div>` : ''}
    </div>`;
  }
  function compactItem(name, count) {
    return `<div class="compact-item"><span class="item-name" title="${name}">${name}</span><span class="item-count">${count}</span></div>`;
  }
  function render(d) {
    if (d.error) return;
    const uniqueUsers = d.total?.uniqueUsers || 0;

    const peers = d.total?.peers || 0;
    const swarms = d.activeSwarms || 0;
    document.getElementById('heroStats').innerHTML = `
      ${heroCard('👤', 'users', '고유 유저', uniqueUsers)}
      ${heroCard('🔗', 'connect', '연결 수', viewers, 'green')}
      ${heroCard('🌐', 'p2p', 'P2P 피어 / Swarms', `${peers} / ${swarms}`, 'orange')}
    `;
    const p1 = d.player1?.viewers || 0;
    const p2 = d.player2?.viewers || 0;
    document.getElementById('playerStats').innerHTML = `
      ${playerCard('플레이어 1', p1)}
      ${playerCard('플레이어 2', p2, 'p2')}
    `;
    const dev = d.devices || {};
    const devT = Object.values(dev).reduce((a, b) => a + b, 0) || 1;
    const mPct = ((dev.mobile||0)/devT*100).toFixed(1);
    const dPct = ((dev.desktop||0)/devT*100).toFixed(1);
    const tPct = ((dev.tablet||0)/devT*100).toFixed(1);
    const oPct = ((dev.unknown||0)/devT*100).toFixed(1);
    document.getElementById('deviceStats').innerHTML = `
      ${statCard('모바일', dev.mobile || 0, mPct + '%', 'mobile')}
      ${statCard('데스크톱', dev.desktop || 0, dPct + '%', 'desktop')}
      ${statCard('태블릿', dev.tablet || 0, tPct + '%', 'tablet')}
      ${statCard('기타', dev.unknown || 0, oPct + '%', 'other')}
    `;
    document.getElementById('deviceBar').innerHTML = `
      <div class="bar-segment bar-mobile" style="width:${mPct}%"></div>
      <div class="bar-segment bar-desktop" style="width:${dPct}%"></div>
      <div class="bar-segment bar-tablet" style="width:${tPct}%"></div>
      <div class="bar-segment bar-other" style="width:${oPct}%"></div>
    `;
    const dn = d.deviceNames || [];
    document.getElementById('deviceNameStats').innerHTML = dn.length ? dn.map(x => compactItem(x.name, x.count)).join('') : compactItem('-', 0);
    const br = d.browsers || [];
    document.getElementById('browserStats').innerHTML = br.length ? br.map(b => compactItem(b.name, b.count)).join('') : compactItem('-', 0);
    const ref = d.referrers || [];
    document.getElementById('refStats').innerHTML = ref.length ? ref.map(r => compactItem(r.name.length > 20 ? r.name.slice(0,20)+'...' : r.name, r.count)).join('') : compactItem('direct', 0);
  }
  async function update() {
    try { await loadWithCache('/api/realtime', 'realtime', render); } catch (e) { console.error(e); }
  }
  update();
  setActiveInterval(update, getPageInterval('realtime'));
}

function initSessions() {
  const st = { p: 1, size: 50, total: 0, sort: 'recent', desc: true, search: '' };
  const sortLabels = { recent: '접속', connected: '유지', speed: '속도', http_bytes: 'HTTP', p2p_bytes: 'P2P↓', p2p_up_bytes: 'P2P↑', total: '총합', peers: '피어' };

  function formatDuration(ms) {
    if (!ms || ms < 0) return '-';
    const secs = Math.floor(ms / 1000);
    if (secs < 60) return `${secs}초`;
    const mins = Math.floor(secs / 60);
    if (mins < 60) return `${mins}분`;
    const hours = Math.floor(mins / 60);
    if (hours < 24) return `${hours}시${mins % 60}분`;
    return `${Math.floor(hours / 24)}일`;
  }

  function formatTime(ts) {
    if (!ts) return '-';
    const d = new Date(ts + serverTimeOffset * 60 * 1000);
    const now = new Date(Date.now() + serverTimeOffset * 60 * 1000);
    const isToday = d.getUTCDate() === now.getUTCDate() && d.getUTCMonth() === now.getUTCMonth() && d.getUTCFullYear() === now.getUTCFullYear();
    const time = `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`;
    return isToday ? time : `${d.getUTCMonth()+1}/${d.getUTCDate()} ${time}`;
  }

  const thMap = {
    thRecent: 'recent', thConnected: 'connected', thSpeed: 'speed',
    thHttp: 'http_bytes', thP2p: 'p2p_bytes', thP2pUp: 'p2p_up_bytes', thTotal: 'total', thPeers: 'peers'
  };

  function updateSortIndicator() {
    Object.entries(thMap).forEach(([id, sort]) => {
      const th = document.getElementById(id);
      if (th) {
        const label = sortLabels[sort] || sort;
        const arrow = st.desc ? '▼' : '▲';
        th.textContent = sort === st.sort ? `${label} ${arrow}` : label;
        th.style.color = sort === st.sort ? '#00d4ff' : '';
      }
    });
  }

  function render(data) {
    st.total = data.total || 0;
    const list = data.data || [];
    const now = Date.now();

    document.querySelector('#sessionsTable tbody').innerHTML = list.map((s) => {
      const ip = s.ip || '-';
      const fn = s.filename?.length > 25 ? s.filename.slice(0, 25) + '...' : (s.filename || '-');
      const connectedAt = parseInt(s.session_id?.split('_')[0]) || 0;
      const connTime = formatTime(connectedAt);
      const duration = connectedAt ? formatDuration(now - connectedAt) : '-';

      // 실시간 트래픽 (r_* 값 = 현재 속도)
      const rHttp = s.r_http_bytes || 0;
      const rP2p = s.r_p2p_bytes || 0;
      const rTotal = rHttp + rP2p;
      const rP2pPct = rTotal > 0 ? Math.round(rP2p / rTotal * 100) : 0;
      const rHttpPct = 100 - rP2pPct;

      // 속도 바
      const speedBar = rTotal > 0 ? `
        <div style="display:flex;align-items:center;gap:3px">
          <div style="flex:1;max-width:50px;height:8px;background:#333;border-radius:2px;overflow:hidden;display:flex">
            <div style="width:${rHttpPct}%;background:#ff6b6b"></div>
            <div style="width:${rP2pPct}%;background:#00ff88"></div>
          </div>
          <span style="font-size:9px;color:#888;white-space:nowrap">${formatBytes(rTotal)}/s</span>
        </div>
      ` : '<span style="color:#444">-</span>';

      // 기기 (PC/M)
      const device = (s.device || '').toLowerCase().includes('mobile') ? 'M' : 'PC';

      // 서버 추출 (every5 -> 5)
      const serverRaw = (s.swarm_id || '').split('.')[0] || '';
      const server = serverRaw.replace(/^every/i, '') || '-';

      // 누적 트래픽
      const httpTotal = s.http_bytes || 0;
      const p2pTotal = s.p2p_bytes || 0;
      const p2pUpTotal = s.p2p_up_bytes || 0;

      return `<tr>
        <td style="color:#aaa;text-align:center;white-space:nowrap">${connTime}</td>
        <td style="color:#00d4ff;text-align:center">${duration}</td>
        <td style="text-align:left;cursor:pointer;color:#00d4ff" onclick="navigator.clipboard.writeText('${ip}').then(()=>{this.style.color='#0f0';setTimeout(()=>this.style.color='#00d4ff',500)})" title="클릭하여 복사">${ip}</td>
        <td style="text-align:center;color:${device === 'M' ? '#ffa500' : '#888'}">${device}</td>
        <td style="text-align:center;color:#888">${server}</td>
        <td title="${s.filename || ''}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${fn}</td>
        <td style="padding:2px 4px">${speedBar}</td>
        <td style="color:#ff6b6b;text-align:right;padding-right:6px">${formatBytes(httpTotal)}</td>
        <td style="color:#00ff88;text-align:right;padding-right:6px">${formatBytes(p2pTotal)}</td>
        <td style="color:#00d4ff;text-align:right;padding-right:6px">${formatBytes(p2pUpTotal)}</td>
        <td style="color:#fff;text-align:right;padding-right:6px;font-weight:bold">${formatBytes(s.ip_total || 0)}</td>
        <td style="color:#888;text-align:center">${s.peers || 0}</td>
      </tr>`;
    }).join('') || '<tr><td colspan="12" style="text-align:center;padding:20px;color:#666">데이터 없음</td></tr>';

    updateSortIndicator();
    const pages = Math.ceil(st.total / st.size) || 1;
    document.getElementById('pageInfo').textContent = `${st.p} / ${pages} (총 ${st.total.toLocaleString()}명)`;
    document.getElementById('prev').disabled = st.p === 1;
    document.getElementById('next').disabled = st.p >= pages;
  }

  function getEndpoint() {
    const sortParam = st.desc ? st.sort : `-${st.sort}`;
    let url = `/api/sessions?limit=${st.size}&offset=${(st.p-1)*st.size}&sort=${sortParam}`;
    if (st.search) url += `&search=${encodeURIComponent(st.search)}`;
    return url;
  }

  async function load() {
    try {
      const res = await fetch(getEndpoint());
      const data = await res.json();
      render(data);
    } catch (e) { console.error(e); }
  }
  load();

  function doSearch() {
    st.search = document.getElementById('sessionSearch').value.trim();
    st.p = 1;
    load();
  }
  document.getElementById('searchBtn').onclick = doSearch;
  document.getElementById('sessionSearch').onkeypress = (e) => { if (e.key === 'Enter') doSearch(); };
  document.getElementById('prev').onclick = () => { if (st.p > 1) { st.p--; load(); } };
  document.getElementById('next').onclick = () => { if (st.p < Math.ceil(st.total / st.size)) { st.p++; load(); } };

  // 헤더 클릭 정렬 - 각 th에 직접 onclick 할당
  Object.entries(thMap).forEach(([id, sort]) => {
    const th = document.getElementById(id);
    if (th) {
      th.onclick = () => {
        if (st.sort === sort) {
          st.desc = !st.desc;  // 같은 컬럼 클릭 시 정렬 방향 토글
        } else {
          st.sort = sort;
          st.desc = true;  // 새 컬럼은 내림차순부터
        }
        st.p = 1;
        load();
      };
    }
  });

  // 2초마다 실시간 갱신
  setActiveInterval(load, 2000);
}

function initLive() {
  let st = { p: 1, size: 20, total: 0 };

  function render(res) {
    st.total = res.total || 0;
    const data = res.data || [];
    document.querySelector('#liveTable tbody').innerHTML = data.map((d, i) => {

      const ratio = t > 0 ? ((d.p2p_bytes || 0) / t * 100).toFixed(1) : '0';
      const sw = d.swarm_id?.length > 20 ? d.swarm_id.slice(0, 12) + '...' + d.swarm_id.slice(-6) : d.swarm_id;
      const fn = d.filename?.length > 25 ? d.filename.slice(0, 25) + '...' : (d.filename || '-');
      return `<tr><td>${idx}</td><td title="${d.filename}">${fn}</td><td title="${d.swarm_id}" style="font-size:10px">${sw}</td><td style="color:#ff6b6b"><b>${d.viewers || 0}</b></td><td>${formatBytes(d.http_bytes)}</td><td>${formatBytes(d.p2p_bytes)}</td><td style="color:#00ff88"><b>${ratio}%</b></td></tr>`;
    }).join('') || '<tr><td colspan="7" style="text-align:center">데이터 없음</td></tr>';
    const pages = Math.ceil(st.total / st.size) || 1;
    document.getElementById('pageInfo').textContent = `${st.p} / ${pages}`;
    document.getElementById('prev').disabled = st.p === 1;
    document.getElementById('next').disabled = st.p >= pages;
  }

  function getEndpoint() {
    return `/api/live?limit=${st.size}&offset=${(st.p-1)*st.size}`;
  }

  async function load() {
    try { await loadWithCache(getEndpoint(), 'live', render); } catch (e) { console.error(e); }
  }
  load();

  document.getElementById('prev').onclick = () => { if (st.p > 1) { st.p--; load(); } };
  document.getElementById('next').onclick = () => { if (st.p < Math.ceil(st.total / st.size)) { st.p++; load(); } };

  setActiveInterval(load, getPageInterval('live'));
}

let trafficPie = null, devicePie = null, playerPie = null, browserPie = null, referrerPie = null, deviceNameBar = null;
function initCharts() {
  const chartOpts = { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#fff', padding: 15, font: { size: 11 } } } } };
  const barOpts = { responsive: true, indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#888' }, grid: { color: '#333' } }, y: { ticks: { color: '#fff' }, grid: { display: false } } } };

  function render(d) {
    const httpBytes = d.total?.httpBytes || 0;
    const p2pBytes = d.total?.p2pBytes || 0;
    const p2pUpBytes = d.total?.p2pUpBytes || 0;
    const dev = d.devices || {};
    const p1 = d.player1?.viewers || 0, p2 = d.player2?.viewers || 0;
    const br = (d.browsers || []).slice(0, 5);
    const ref = (d.referrers || []).slice(0, 5);
    const dn = (d.deviceNames || []).slice(0, 5);

    // 트래픽 비율 범례
    const total = httpBytes + p2pBytes + p2pUpBytes;
    const httpPct = total > 0 ? (httpBytes / total * 100).toFixed(1) : 0;
    const p2pPct = total > 0 ? (p2pBytes / total * 100).toFixed(1) : 0;
    const upPct = total > 0 ? (p2pUpBytes / total * 100).toFixed(1) : 0;
    document.getElementById('trafficLegend').innerHTML = `
      <span><span style="color:#ff6b6b">●</span> HTTP ${httpPct}%</span>
      <span><span style="color:#00ff88">●</span> P2P Down ${p2pPct}%</span>
      <span><span style="color:#00d4ff">●</span> P2P Up ${upPct}%</span>
    `;

    if (!trafficPie) {
      trafficPie = new Chart(document.getElementById('trafficPie'), {
        type: 'doughnut', data: { labels: ['HTTP', 'P2P Down', 'P2P Up'], datasets: [{ data: [httpBytes, p2pBytes, p2pUpBytes], backgroundColor: ['#ff6b6b', '#00ff88', '#00d4ff'], borderWidth: 0 }] },
        options: { ...chartOpts, cutout: '65%', plugins: { ...chartOpts.plugins, legend: { display: false } } }
      });
      devicePie = new Chart(document.getElementById('devicePie'), {
        type: 'doughnut', data: { labels: ['모바일', '데스크톱', '태블릿', '기타'], datasets: [{ data: [dev.mobile||0, dev.desktop||0, dev.tablet||0, dev.unknown||0], backgroundColor: ['#00ff88', '#00d4ff', '#ffa502', '#778ca3'], borderWidth: 0 }] },
        options: { ...chartOpts, cutout: '60%' }
      });
      playerPie = new Chart(document.getElementById('playerPie'), {
        type: 'doughnut', data: { labels: ['Player 1', 'Player 2'], datasets: [{ data: [p1, p2], backgroundColor: ['#ff6b6b', '#a55eea'], borderWidth: 0 }] },
        options: { ...chartOpts, cutout: '60%' }
      });
      browserPie = new Chart(document.getElementById('browserPie'), {
        type: 'doughnut', data: { labels: br.map(x => x.name), datasets: [{ data: br.map(x => x.count), backgroundColor: ['#ffa502', '#ff6b6b', '#00d4ff', '#00ff88', '#a55eea'], borderWidth: 0 }] },
        options: { ...chartOpts, cutout: '60%' }
      });
      referrerPie = new Chart(document.getElementById('referrerPie'), {
        type: 'doughnut', data: { labels: ref.map(x => x.name || 'direct'), datasets: [{ data: ref.map(x => x.count), backgroundColor: ['#a55eea', '#26de81', '#fd9644', '#00d4ff', '#ff6b6b'], borderWidth: 0 }] },
        options: { ...chartOpts, cutout: '60%' }
      });
      deviceNameBar = new Chart(document.getElementById('deviceNameBar'), {
        type: 'bar', data: { labels: dn.map(x => x.name?.slice(0,15) || '-'), datasets: [{ data: dn.map(x => x.count), backgroundColor: '#26de81', borderRadius: 4 }] },
        options: barOpts
      });
    } else {
      trafficPie.data.datasets[0].data = [httpBytes, p2pBytes, p2pUpBytes]; trafficPie.update('none');
      devicePie.data.datasets[0].data = [dev.mobile||0, dev.desktop||0, dev.tablet||0, dev.unknown||0]; devicePie.update('none');
      playerPie.data.datasets[0].data = [p1, p2]; playerPie.update('none');
      browserPie.data.labels = br.map(x => x.name); browserPie.data.datasets[0].data = br.map(x => x.count); browserPie.update('none');
      referrerPie.data.labels = ref.map(x => x.name || 'direct'); referrerPie.data.datasets[0].data = ref.map(x => x.count); referrerPie.update('none');

  }
  update();
