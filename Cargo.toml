[package]
name = "p2p_stats"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
actix-web = { version = "4", features = ["rustls-0_23"] }
actix-rt = "2"
actix-files = "0.6"
actix-cors = "0.7"
actix-web-actors = "4"
actix = "0.13"

# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Dragonfly (Redis 호환)
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# ClickHouse
clickhouse = { version = "0.11", features = ["lz4"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "fast-rng"] }
dashmap = "5"
parking_lot = "0.12"
num_cpus = "1"
url = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# TLS
actix-tls = { version = "3", features = ["rustls-0_23"] }
rustls = "0.23"
rustls-pemfile = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.release.build-override]
opt-level = 3
