[package]
name = "simple_ws"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio = { version = "1", features = ["full", "signal"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
lazy_static = "1"
rand = "0.8"
parking_lot = "0.12"
arc-swap = "1.7"
reqwest = { version = "0.12", features = ["json"] }
chrono = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
