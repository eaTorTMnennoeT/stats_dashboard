[package]
name = "simple_tracker"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = { version = "4", features = ["rustls-0_23"] }
actix-ws = "0.3"
actix-rt = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
futures-util = "0.3"
parking_lot = "0.12"
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
actix-tls = { version = "3", features = ["rustls-0_23"] }
log = "0.4"
env_logger = "0.11"
rand = "0.8"
hex = "0.4"
num_cpus = "1.16"
maxminddb = "0.24"
once_cell = "1.19"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
